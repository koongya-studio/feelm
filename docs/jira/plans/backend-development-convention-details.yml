tasks:
- id: backend-development-convention-details
  issue_type: Task
  summary: '[백엔드] 개발 컨벤션 세부 규칙 확정 및 문서화'
  description: 기존 백엔드 코드 스타일과 Spotless 자동 포맷팅 기준에 이어, 포맷터가 강제하지 못하는 개발 규칙을 팀 합의로 확정하고 문서화한다. 클래스·메서드·변수와
    DTO의 네이밍, 패키지 구조, Entity 분리 원칙, 예외 처리와 공통 에러 응답, Lombok 사용 범위를 다루며 기존 API와 구현 계약을 임의로 변경하지 않는다. 테스트 작성
    기준과 테스트 코드 네이밍은 별도 후속 업무에서 확정한다.
  area: 백엔드
  story_points: 3
  done_when:
  - 클래스·메서드·변수와 계층별 타입의 네이밍 기준이 문서화되어 있다.
  - 백엔드 패키지 구조와 계층 또는 도메인 간 의존 방향이 문서화되어 있다.
  - Entity와 DTO의 분리 원칙 및 요청·응답 DTO 네이밍 기준이 문서화되어 있다.
  - 예외 처리 책임과 공통 에러 응답 적용 원칙이 기존 API 계약과 충돌하지 않도록 정리되어 있다.
  - Lombok 어노테이션의 허용 범위와 제한 사항이 문서화되어 있다.
  - 미확정 사항과 후속 구현이 필요한 항목이 구분되어 있다.
  jira_key: S15P21E106-173
