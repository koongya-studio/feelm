tasks:
  - id: backend-auto-deployment
    issue_type: Task
    summary: '[인프라] 백엔드 자동 배포 전환 및 실패 복구·재시도 보완'
    area: 인프라
    story_points: 8
    sprint: active
    description: |
      develop 병합 후 테스트와 이미지 빌드를 통과하면 백엔드 배포를 자동 실행하여 수동 배포 대기와 반복 조작을 줄인다.
      실패 시 이전 정상 이미지로 복구하고, 일시적 장애만 제한적으로 자동 재시도하며 코드·설정 오류는 수정 후 재배포한다.
      현재 배포 스크립트는 헬스체크 실패 시 롤백하지만 컨테이너 교체 명령 자체가 실패하면 복구 경로에 도달하지 않을 수 있어 보완한다.
      예상 변경 범위는 .gitlab-ci.yml, infra/scripts/deploy-backend.sh, rollback-backend.sh 및 관련 검증·운영 문서이다.
      공통 CI 설정과 배포·의존성 캐시의 공유 resource_group에 영향을 주므로 구현 전 관련 열린 MR과 중복을 확인한다.
      API, DB Schema, 환경변수 및 인프라 보안 정책 변경은 범위에 포함하지 않는다. 신규 알림 채널이나 외부 서비스가 필요하면 별도 합의한다.
      8 SP 산정 근거: 배포 직렬화와 순서 보장, 부분 실패·롤백 실패의 정합성, 서비스 서버 장애 복구 검증 및 운영자 개입이 필요하다.
    done_when:
      - 보호된 develop의 병합 결과 push에서 테스트·이미지 빌드 성공 후 해당 commit SHA 이미지가 자동 배포되고, MR 및 리뷰 전용 파이프라인에서는 배포되지 않는다.
      - 기존 배포와 의존성 캐시 작업의 직렬화를 유지하고, 늦게 실행되거나 재시도된 과거 파이프라인이 최신 배포를 덮어쓰지 않도록 한다. 의도적인 수동 롤백 절차는 유지한다.
      - 이미지 준비 실패 시 기존 서비스를 유지하고, 컨테이너 교체 또는 헬스체크 실패 시 직전 정상 이미지로 복구한다. 이전 이미지가 없는 최초 배포와 롤백 자체 실패도 명확히 실패 처리한다.
      - 롤백 후 이미지 SHA, Docker healthcheck 및 Actuator 응답으로 복구를 검증하고, 복구에 성공하더라도 후보 배포 Job은 실패 상태를 유지한다.
      - 재시도 가능한 일시적 장애의 종류와 횟수 상한을 명시하고, 코드·설정·헬스체크 오류와 롤백 실패를 무조건 자동 재시도하지 않는다. 수동 재시도 및 수정 후 재배포 절차를 제공한다.
      - 기존 사용 가능한 알림 수단을 확인해 실패한 배포와 복구 결과를 담당자가 알 수 있도록 하고, 로그·알림에 Secret을 노출하지 않는다.
      - 정상 자동 배포, 이미지 준비 실패, 컨테이너 교체 실패, 헬스체크 실패, 롤백 실패, 최초 배포 실패, 연속 병합 및 재시도 시나리오를 검증한다. 서버 적용·복구 검증은 운영자와 일정을 조율하고 미검증 사항을 기록한다.
      - 운영 문서에 자동 배포 조건, 재시도·수동 복구 방법 및 DB migration은 이미지 롤백으로 되돌아가지 않는 제약을 기록한다.
    jira_key: S15P21E106-292
