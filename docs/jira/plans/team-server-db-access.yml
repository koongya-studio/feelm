tasks:
  - id: team-server-db-access-guide
    issue_type: Task
    summary: '[인프라] 서버 PostgreSQL 조회 접속 절차 문서화'
    area: 인프라
    story_points: 5
    description: |
      SSH 터널과 DBeaver를 이용한 서버 PostgreSQL 접속 절차를 문서화한다.
      최초 조회 안내만 작성하는 2 SP 범위에서 사용자 합의에 따라
      개발 계정 권한 검토와 SSH 접속용 Compose 루프백 설정까지 확대했다.
      권한 설계와 서버 통합 검증을 고려해 계획의 SP를 5로 재산정했다.
      원격 Jira 본문과 5 SP를 현재 합의 범위 및 검증 현황으로 동기화했다.

      초기 적재 데이터 보호와 개발·테스트 데이터 변경을 구분하고,
      신규 테이블 권한 및 운영 전환 시 접근 회수 절차를 명시한다.
      계정명, 비밀번호, 서버 접속 정보와 개별 권한 내역은 이 계획에 기록하지 않는다.

      진행: 캡처를 포함한 접속 안내와 권한 범위 문서화 완료.
      사용자에 의한 SSH 연결·일부 권한 검증 완료.
      Compose 루프백 설정과 저장소 안내 반영 완료.
      더미 환경변수로 서버·로컬 Compose의 포트 중복 없음과 볼륨·내부 DB 주소 보존 확인.
      사용자 실행 결과로 서버 적용 후 DB healthy와 루프백 바인딩을 확인했다.
      DBeaver 연결 테스트 및 SQL로 접속 DB·개발 계정 확인을 완료했다.
      검증 근거는 사용자 제공 명령 결과·캡처·SQL 결과 확인이며 AI의 직접 서버 검증은 아니다.
      전체 테이블의 실제 쓰기·삭제 및 외부 네트워크 차단 테스트는 미실행이다.
      남은 작업: MR 생성·리뷰·병합. Redis와 초기 적재 계정은 별도 업무로 다룬다.

      제외: DB 포트 인터넷 공개, SSH·방화벽 정책 변경, 기존 애플리케이션 계정 변경,
      DB 스키마 변경, 데이터 적재·삭제, 자동 배포 작업 변경.
      관련 완료 업무: S15P21E106-177, S15P21E106-183, S15P21E106-221.
      Swagger 접근 구성 S15P21E106-223과는 별도 범위다.
    done_when:
      - 접속 준비물, SSH·DBeaver 설정, 연결 종료 및 오류 확인 절차를 문서화한다.
      - 보호 데이터와 개발용 변경 범위를 확정하고 허용·거부 권한 및 인증 검증 결과를 기록한다.
      - Compose 루프백 포트가 로컬 오버레이와 중복되지 않고 기존 볼륨을 유지하는지 확인한다.
      - 서버 적용 후 바인딩·헬스 상태와 실제 DB 접속을 검증한다.
      - 노션·저장소 문서에 검증 결과와 미완료 항목을 구분해 반영한다.
      - 최신 develop 및 열린 MR의 충돌을 확인하고 Jira 범위·SP와 계획을 일치시킨다.
    jira_key: S15P21E106-224
    epic: S15P21E106-38
