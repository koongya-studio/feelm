tasks:
- id: redis-readonly-access
  issue_type: Task
  summary: '[인프라] Redis Insight 조회 전용 SSH 접속 기반 구성'
  area: 인프라
  story_points: 5
  description: 'Redis Insight에서 SSH 터널을 통해 서버 Redis의 추천 데이터를 조회할 수 있도록 구성한다.

    기존 Redis 실행환경 구성(S15P21E106-182)과 PostgreSQL 접속 문서화(S15P21E106-224)의 후속 업무다.

    서버 루프백 포트 연결, 조회 전용 ACL 계정, 도구 연결 검증과 Notion 접속 가이드를 포함한다.

    추천 키 계약은 S15P21E106-131 및 S15P21E106-147의 최신 확정 내용을 따른다.

    로그인 관련 데이터는 조회 대상에서 제외하며 테스트 데이터 변경 권한은 별도 후속 업무로 둔다.

    ACL과 도구 호환성, 기존 애플리케이션 영향 및 서버 적용 검증을 고려해 5 SP로 산정한다.

    계정명, 비밀번호, 서버 접속 정보 및 개인키는 계획 파일과 Jira에 기록하지 않는다.

    제외: Redis 인터넷 공개, 추천 로직 및 키 계약 변경, 기존 데이터 일괄 삭제,

    개발자 쓰기 권한 부여, 기존 애플리케이션 인증 방식의 임의 변경.

    '
  done_when:
  - Redis 포트를 서버 루프백에만 연결하고 로컬 Compose와 포트 충돌이 없는지 확인한다.
  - 최신 확정 추천 키와 Redis Insight에 필요한 명령을 검토해 최소 조회 권한을 설정한다.
  - 허용된 추천 키 조회 성공과 로그인 키 값 접근 및 쓰기·삭제·관리 명령 거부를 검증한다.
  - 키 목록 조회 시 제외 대상 키 이름의 노출 여부를 확인하고 ACL 한계가 있으면 대안을 확정해 기록한다.
  - 조회 계정 설정의 재시작 후 유지와 비밀정보 주입·회수 절차를 확인한다.
  - 기존 애플리케이션 연결과 데이터 유지, Redis Insight SSH 연결·조회 동작을 검증한다.
  - 추천 데이터가 미적재 상태이면 안전한 검증 방법을 정하고 실제 데이터 검증과 구분해 기록한다.
  - Notion에 설치·SSH·조회 계정 연결·조회 범위·오류 확인 절차를 핵심 위주로 작성한다.
  jira_key: S15P21E106-225
  epic: S15P21E106-38
