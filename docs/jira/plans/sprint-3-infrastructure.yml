tasks:
- id: sprint3-infrastructure-scaffold-nginx
  issue_type: Task
  summary: '[인프라] 서비스·분산 인프라 기본 구조 및 Nginx 초기 구성'
  description: 서비스 서버 J15E106과 분산 처리 서버 J15E106A의 역할을 분리해 관리할 수 있도록 infra 디렉터리와 서버별 Docker Compose 파일의
    기본 골격을 구성한다. 외부 진입점인 Nginx를 최소 구성으로 실행해 도메인 접속을 확인하고, 이후 로컬 통합환경과 CI/CD 및 서비스 배포 작업이 확장할 기준을 문서화한다.
    이 업무에는 애플리케이션·데이터 저장소·분산 처리 컴포넌트의 실제 컨테이너 구성, 서비스별 이미지 빌드, CI/CD 파이프라인 및 배포·롤백 자동화를 포함하지 않는다.
  epic: S15P21E106-38
  story_points: 3
  done_when:
  - infra 아래에 compose, nginx, hadoop, spark, kafka 및 scripts 설정을 관리할 기본 구조가 생성된다.
  - J15E106용 service Compose 파일과 J15E106A용 distributed Compose 파일의 역할 및 확장 기준이 정의된다.
  - J15E106과 J15E106A에서 실행할 서비스 역할이 infra/README.md에 문서화된다.
  - Nginx가 Docker Compose로 기동되고 외부 80번 포트의 요청을 수신한다.
  - j15e106.p.ssafy.io를 통한 Nginx 기본 응답이 확인된다.
  - 인프라 설정은 GitLab에서 관리하고 서버에서 직접 수정하지 않는 원칙이 문서화된다.
  - 실제 Secret이 저장소에 포함되지 않고 내부 서비스 포트의 비공개 원칙이 반영된다.
  - PostgreSQL, Redis, Kafka, HDFS, Spark 및 애플리케이션 프록시의 실제 구성은 후속 Jira 범위로 남는다.
  jira_key: S15P21E106-126
- id: sprint3-local-compose
  issue_type: Task
  summary: '[인프라] 로컬 통합 개발환경 구성'
  description: 3주차 스프린트에서 백엔드, 프론트엔드, 추천 시스템과 필수 데이터 저장소를 팀원이 같은 방식으로 실행할 수 있도록 Docker Compose 기반 로컬 통합
    개발환경을 구성한다. 서비스별 기술 스택과 포트가 확정되기 전에는 임의의 계약을 고정하지 않고 담당자 합의를 반영한다.
  epic: S15P21E106-38
  story_points: 5
  done_when:
  - 서비스별 실행 명령, 포트, 의존 서비스와 헬스체크 계약이 담당자 간 합의된다.
  - 실제 Secret 없이 예시 환경변수만으로 로컬 구성을 준비할 수 있다.
  - 한 번의 명령으로 필수 서비스가 기동되고 종료된다.
  - 서비스 시작 순서와 장애 상태를 헬스체크로 확인할 수 있다.
  - 신규 팀원이 따라 할 수 있는 실행, 초기화 및 문제 해결 절차가 infra/README.md에 문서화된다.
  - 로컬 통합 실행과 서비스 간 연결이 검증된다.
  jira_key: S15P21E106-86
- id: sprint3-container-build
  issue_type: Task
  summary: '[인프라] 백엔드 컨테이너 빌드 구성'
  description: Spring Boot 백엔드를 CI와 배포 환경에서 일관되게 실행할 수 있도록 Java 21과 Gradle 빌드를 사용하는 운영용 컨테이너 이미지 구성을 작성하고
    검증한다. 프론트엔드와 추천 Consumer의 컨테이너 구성은 각각 별도 Jira 업무에서 처리한다.
  epic: S15P21E106-38
  story_points: 3
  done_when:
  - Java 21과 Gradle Wrapper를 사용하는 백엔드 빌드 절차가 컨테이너 구성에 반영된다.
  - 개발용 의존성과 빌드 도구가 운영 실행 이미지에서 제외된다.
  - Secret, 로컬 빌드 산출물 및 불필요한 파일이 이미지와 빌드 컨텍스트에 포함되지 않는다.
  - 백엔드 컨테이너 이미지가 깨끗한 환경에서 빌드된다.
  - 컨테이너가 8080 포트로 기동되고 /actuator/health 응답이 UP 상태로 확인된다.
  - 이미지 빌드와 실행 방법이 backend/README.md에 문서화된다.
  jira_key: S15P21E106-87
- id: sprint3-frontend-container-build
  issue_type: Task
  summary: '[인프라] 프론트엔드 컨테이너 빌드 구성'
  description: 프론트엔드 기본 프로젝트와 패키지 관리 및 배포 방식이 확정된 뒤, CI와 배포 환경에서 재현 가능한 프론트엔드 컨테이너 이미지 빌드 구성을 작성하고 검증한다.
  epic: S15P21E106-38
  story_points: 3
  done_when:
  - 프론트엔드 런타임, 패키지 매니저, 잠금 파일 및 빌드 명령이 확정되어 컨테이너 구성에 반영된다.
  - 개발 의존성과 운영용 정적 산출물이 분리된다.
  - Secret, 로컬 빌드 산출물 및 불필요한 파일이 이미지와 빌드 컨텍스트에 포함되지 않는다.
  - 프론트엔드 컨테이너 이미지가 깨끗한 환경에서 빌드된다.
  - 컨테이너가 확정된 포트로 기동되고 기본 화면 또는 헬스체크 응답이 확인된다.
  - 이미지 빌드와 실행 방법이 frontend/README.md에 문서화된다.
  jira_key: S15P21E106-128
- id: sprint3-recommendation-consumer-container-build
  issue_type: Task
  summary: '[인프라] 추천 Consumer 컨테이너 빌드 구성'
  description: Python 기반 Fold-in Consumer의 실행 구조와 Kafka 연동 계약이 확정된 뒤, CI와 배포 환경에서 재현 가능한 추천 Consumer 컨테이너
    이미지 빌드 구성을 작성하고 검증한다.
  epic: S15P21E106-38
  story_points: 5
  done_when:
  - Python 버전, 의존성 잠금 방식, Consumer 진입점 및 Kafka 연동 환경변수가 확정되어 컨테이너 구성에 반영된다.
  - 빌드 의존성과 운영 실행 의존성이 필요한 범위에서 분리된다.
  - Secret, 모델·데이터 산출물 및 로컬 전용 파일이 이미지와 빌드 컨텍스트에 포함되지 않는다.
  - 추천 Consumer 컨테이너 이미지가 깨끗한 환경에서 빌드된다.
  - 컨테이너가 Kafka 연결 실패와 종료 신호를 안전하게 처리하는지 검증된다.
  - Consumer의 실행 상태를 확인할 로그 또는 헬스체크 기준이 정의된다.
  - 이미지 빌드와 실행 방법이 pipeline/README.md에 문서화된다.
  jira_key: S15P21E106-129
- id: sprint3-gitlab-ci
  issue_type: Task
  summary: '[인프라] GitLab CI 품질 검증 및 이미지 빌드 파이프라인 구성'
  description: Merge Request와 develop 브랜치에서 서비스별 정적 검사, 테스트 및 빌드를 자동화하고, 승인된 브랜치에서 배포 가능한 컨테이너 이미지를 생성하는
    GitLab CI 파이프라인을 구성한다. S15P21E106-39에서 확인한 Runner와 Registry 조건을 적용한다.
  epic: S15P21E106-38
  story_points: 8
  done_when:
  - Merge Request에서 변경 영역에 필요한 정적 검사, 테스트 및 빌드가 자동 실행된다.
  - 실패한 필수 검증이 병합 전에 명확히 표시된다.
  - develop 브랜치의 성공한 파이프라인에서 서비스 이미지를 재현 가능하게 빌드한다.
  - 이미지가 커밋과 파이프라인을 추적할 수 있는 태그로 Registry에 저장된다.
  - 캐시와 병렬 실행을 적용하되 오래된 결과가 검증을 우회하지 않는다.
  - 보호·마스킹된 CI/CD Variable만 사용하며 Secret이 로그와 산출물에 노출되지 않는다.
  - 파이프라인 실행 조건과 장애 대응 방법이 문서화된다.
  jira_key: S15P21E106-88
- id: sprint3-staging-deployment
  issue_type: Task
  summary: '[인프라] 스테이징 서버 배포 및 롤백 절차 구성'
  description: GitLab Registry의 검증된 이미지를 스테이징 서버에 배포하고 장애 시 이전 버전으로 복구할 수 있는 최소 배포 절차를 구성한다. 실제 배포 방식과
    접근 권한은 S15P21E106-39의 조사 결과 및 서버 제공 조건을 따른다.
  epic: S15P21E106-38
  story_points: 8
  done_when:
  - 스테이징 서버의 네트워크, 저장공간, 런타임 및 접근 권한 전제조건이 확인된다.
  - 승인된 사용자 또는 보호 브랜치만 배포를 실행할 수 있다.
  - 배포 대상 이미지 버전과 실행 중인 버전을 확인할 수 있다.
  - 배포 후 서비스 헬스체크 실패 시 중단하거나 복구할 수 있다.
  - 직전 정상 이미지로 롤백하는 절차가 실제로 검증된다.
  - 서버의 Secret은 저장소와 이미지 밖에서 주입되고 로그에 노출되지 않는다.
  - 배포, 검증, 롤백 및 기본 장애 대응 절차가 infra/README.md에 문서화된다.
  jira_key: S15P21E106-89
