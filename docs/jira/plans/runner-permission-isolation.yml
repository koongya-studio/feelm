tasks:
- id: runner-permission-isolation
  issue_type: Task
  summary: '[인프라] MR 검증 Runner와 운영 빌드·배포 권한 분리'
  area: 인프라
  story_points: 8
  description: 'S15P21E106-221 점검에서 일반 MR 테스트와 운영 빌드·배포가 같은 shell Runner 및 서비스 서버 Docker 소켓 접근 계정을 사용하는
    구성을 확인했다. 일반 MR 코드가 운영 Docker·볼륨·배포 Secret에 접근하지 않도록 실행 환경과 권한을 분리한다. 실행 환경 선택과 비용·자원·전환 영향은 구현 전에
    운영자와 합의하며 서버 증설을 전제하지 않는다. 변수 보호 및 service 범위 변경 이후 MR !67 파이프라인 #179331의 backend-test는 통과했다. 해당 결과는
    Runner 격리 또는 Secret 완전 차단의 증명이 아니다. 221은 점검 기록으로 유지하고 이 업무에서 개선을 수행한다. S15P21E106-88의 품질 검증·이미지 파이프라인
    확장과 중복 구현하지 않고 격리 경계와 적용 순서를 먼저 합의한다. 보안 경계 설계, Docker 기반 테스트 호환성, 운영 전환·복구 검증을 고려해 8 SP로 산정했다.'
  done_when:
  - MR 테스트, 이미지 빌드·푸시, 운영 배포별 실행 주체·Docker 대상·Secret 범위와 신뢰 경계를 설계하고 운영자와 합의한다.
  - 일반 MR 테스트가 운영 Docker 소켓·볼륨·배포 인증정보를 공유하지 않는 환경에서 실행되도록 구성한다. Docker 기반 테스트의 대체 실행 방식도 검증한다.
  - 보호 브랜치의 빌드·푸시 및 승인된 수동 배포 조건을 유지하고, Runner 태그·보호 설정·변수 범위와 잔존 Docker 인증정보를 함께 검토한다. 이름만 다른 Runner가
    같은 운영 데몬을 공유하는 구성을 격리로 간주하지 않는다.
  - Secret 원문 출력이나 운영 데이터 접근·삭제 없이 일반 MR의 운영 권한 차단과 테스트 성공을 검증하고 증빙을 남긴다.
  - 운영자 승인 하에 보호 브랜치 빌드·푸시와 배포 동작을 검증한다. 전환 순서·중단 영향·실패 시 복구 절차를 사전에 마련한다.
  - 설정·운영 문서와 검증 결과를 저장소에 기록하고 남은 위험을 구분한다. 백업 구축·로그 제한 및 기능 CI 확장은 범위에서 제외한다.
  epic: S15P21E106-38
  jira_key: S15P21E106-222
