tasks:
- id: mr-default-template
  issue_type: Task
  summary: '[협업] MR 기본 템플릿 개선'
  description: MR 본문이 변경 사실의 나열보다 배경, 판단 근거, 검증 결과와 리뷰 결정을 명확히 전달하도록 기본 템플릿과 Git 협업 규칙을 정비한다.
  area: 협업
  story_points: 1
  done_when:
  - Default.md가 배경과 목적, 논리 단위 변경 내용, 검토가 필요한 결정, 검증 결과와 남은 위험을 구분해 안내한다.
  - 공통 계약과 설정의 영향 여부 및 관련 담당자 리뷰 필요성을 명확히 확인할 수 있다.
  - docs/git-convention.md의 MR 본문 규칙이 변경된 기본 템플릿과 일치한다.
  jira_key: S15P21E106-185
  epic: S15P21E106-12
