tasks:
- id: infra-operational-safety-audit
  issue_type: Task
  summary: '[인프라] 운영 기본 안전성 점검 및 개선 항목 도출'
  description: 서비스·분산 서버의 백업·복원 준비, 디스크·로그 제한, GitLab Runner 접근 권한 및 SSH 인증 설정을 읽기 전용으로 점검한다. 기존 CI 확장
    업무에 앞서 실제 위험을 확인하고 필요한 개선만 후속 업무로 분리한다. 설정 변경, 데이터 삭제, 서비스 재시작 및 실제 복원 실행은 포함하지 않는다.
  area: 인프라
  story_points: 3
  done_when:
  - PostgreSQL·HDFS·Kafka의 보존 대상, 백업 유무·위치·주기·접근 권한 및 복원 절차와 기존 검증 근거를 확인한다. 실제 복원은 수행하지 않는다.
  - 두 서버의 디스크·inode 사용량, Docker 로그 제한·회전 설정 및 빌드 캐시 현황을 확인한다.
  - GitLab Runner 실행 위치·방식과 Docker·운영 볼륨·Secret 접근 가능 범위, MR 실행 신뢰 경계를 확인한다.
  - SSH의 실제 적용 인증 설정, root 로그인과 비밀번호 로그인 허용 여부 및 기존 방화벽 접근 범위를 확인한다.
  - 점검 결과를 근거·위험도·조치 필요 여부로 문서화하고 확인하지 못한 항목을 구분한다. Secret 원문은 문서·로그·Jira에 기록하지 않는다.
  - 확인된 개선 사항만 후속 작업 후보로 정리하며, 설정 변경·데이터 삭제·서비스 재시작은 수행하지 않는다.
  jira_key: S15P21E106-221
  epic: S15P21E106-38
