tasks:
- id: ott-subscription-recommendation-spec
  issue_type: Task
  summary: '[협업] OTT 구독 추천 요구사항·API 명세 작성'
  description: 팀 제안(2026-08-31) 기능인 OTT 구독 추천의 설계 문서 초안을 작성한다. 사용자 취향 벡터와 유사한 미감상 영화 수를 OTT별로 집계해 구독 효용이
    높은 순으로 추천하고 대표 영화 3편을 함께 보여주는 확장 기능으로, 요구사항 정의서에 FR-40을 추가하고 API 명세에 API-068(GET /recommendations/otts)을
    추가한다. 유사도 임계치·갱신 주기·콜드 스타트 등 팀 결정 필요 값은 미정 사항으로 표시한다.
  area: 협업
  epic: S15P21E106-12
  story_points: 2
  done_when:
  - docs/requirements.md에서 FR-40 요약·상세·인수 조건과 미결 사항을 확인할 수 있다.
  - docs/api/recommendation.md에서 API-068의 요청·응답·처리 규칙·미정 사항을 확인할 수 있다.
  - docs/api/README.md 색인에 API-068이 등록되어 있다.
  - TMDb watch provider 매핑(API-025) 확정이 선행 조건임이 명세에 표시되어 있다.
  - 팀 채택 전 제안 상태임이 (가정) 표기로 구분되어 있다.
  jira_key: S15P21E106-125
