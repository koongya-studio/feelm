tasks:
  - id: realtime-processing-split
    issue_type: Task
    summary: "[설계] 실시간 추천·인기 집계 처리 구조 분할 및 계약 확정"
    description: "실시간 처리의 계산 특성에 맞게 책임을 분리한다. 사용자 한 명의 평가·온보딩 변경에 따른 Fold-in과 Candidate 갱신은 Python Consumer가 담당하고, 여러 사용자의 영화 조회를 집계하는 실시간 인기 영화 산출은 Spark Structured Streaming이 담당하도록 구조를 확정한다. ADR-0017로 기존 ADR-0016의 책임 경계를 대체하고, 결정에 맞춰 FR-27, API-064, 이벤트 계약과 아키텍처 구조도의 정합성을 맞춘다. 집계 윈도우·점수식·최소 사용자 수·반영 지연과 실제 Consumer·Streaming Job 구현은 이 업무의 범위에서 제외한다."
    area: 설계
    epic: S15P21E106-38
    story_points: 5
    sprint: backlog
    done_when:
      - "ADR-0017에 Python Consumer와 Spark Structured Streaming의 선택 근거, 책임 경계와 데이터 흐름이 정의되어 있다."
      - "ADR-0016이 ADR-0017로 대체되었으며 현재 유효한 결정이 ADR 목록에서 명확하다."
      - "사용자 단위 Fold-in·Candidate 갱신과 다중 사용자 인기 집계의 소비 주체와 상태·재처리 경계가 정의되어 있다."
      - "Python Consumer가 Candidate와 기본 Top-N을 같은 사용자 단위 처리에서 갱신해 stale topn을 방지하고, Spring이 새 추천 세트 생성 시 최신 행동 Feature로 경량 재정렬하는 기준이 정의되어 있다."
      - "집계 윈도우·중복 처리·최소 사용자 수·점수식·반영 지연과 결과 저장 세부 계약이 후속 결정 사항으로 명시되어 있다."
      - "FR-27과 API-064가 조회 이벤트 기반 실시간 인기 집계 방향과 일치한다."
      - "README 아키텍처·추천 파이프라인 구조도와 관련 문서에 상충되는 설명이 없다."
    jira_key: S15P21E106-176
