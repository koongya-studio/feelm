tasks:
- id: secret-env-management
  issue_type: Task
  summary: '[인프라] Secret 및 환경변수 관리 규칙 수립'
  description: 개발·CI/CD·운영 환경에서 Secret과 환경변수를 안전하고 일관되게 관리하기 위한 저장소 기준을 수립한다.
  done_when:
  - 실제 Secret과 로컬 .env 파일이 Git 추적 대상에서 제외된다.
  - .env.example 작성 원칙과 안전한 예시값 기준이 문서화된다.
  - 로컬·CI/CD·운영 환경의 변수 주입 및 보관 방식이 구분된다.
  - GitLab CI/CD Variables 사용 원칙과 보호·마스킹 기준이 문서화된다.
  - 로그, MR, 문서 및 AI 프롬프트의 Secret 노출 방지 기준이 정의된다.
  - Secret 노출 시 폐기·재발급 대응 절차가 정의된다.
  - 관련 협업 문서와 저장소 규칙에서 해당 기준 문서를 찾을 수 있다.
  jira_key: S15P21E106-37
