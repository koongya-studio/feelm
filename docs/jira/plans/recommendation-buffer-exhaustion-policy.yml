tasks:
- id: recommendation-buffer-exhaustion-policy
  issue_type: Task
  summary: '[설계] 추천 버퍼 소진 및 행동 Feature 반영 규칙 보강'
  description: ADR-0017에서 확정한 추천 갱신 정책을 추천 세트 생성 흐름에 명확히 반영한다. 관심없음·평가 이후 API-046이 빈 자리 보충 후보를 찾지 못하면 현재 유효 카드는 유지하고,
    다음 추천 조회에서 최신 행동 Feature를 반영한 새 추천 세트를 생성한다는 처리 규칙을 문서화해 API-045 및 추천 처리 계약과의 정합성을 맞춘다.
  area: 설계
  epic: S15P21E106-38
  story_points: 1
  sprint: active
  done_when:
  - API-046은 미노출 후보가 남은 경우 기존 추천 세트의 빈 자리 1편만 보충한다는 규칙이 명시되어 있다.
  - 보충 후보가 없어 버퍼가 소진된 경우 다음 추천 조회에서 새 추천 세트를 생성한다는 규칙이 명시되어 있다.
  - 새 추천 세트 생성 시 최신 행동 Feature를 반영한다는 규칙이 명시되어 있다.
  - API-045, ADR-0017 및 스트리밍 계약과 표현이 일치한다.
  jira_key: S15P21E106-191
