tasks:
- id: project-readme
  issue_type: Task
  summary: '[협업] 프로젝트 소개 README 작성'
  description: 저장소 루트 README에 서비스 feelm의 기획 배경, 주요 기능, 활용 데이터, 시스템 아키텍처, 추천 파이프라인, 검증 계획, 기술 스택, 저장소 구조,
    협업 규칙, 팀 구성을 정리한다. 저장소만 확인해도 프로젝트 개요와 개발·협업 체계를 파악할 수 있도록 하고, 확정되지 않은 항목은 미정으로 표기한다.
  area: 협업
  story_points: 2
  done_when:
  - 서비스명 feelm과 한 줄 소개, 기획 배경과 차별점을 README에서 확인할 수 있다.
  - 1차 MVP, 2차 MVP, 확장 기능과 비기능 요구사항을 요구사항 정의서 ID 기준으로 정리한다.
  - 시스템 아키텍처와 추천 파이프라인을 GitLab에서 렌더링되는 Mermaid 다이어그램으로 제공한다.
  - 개인 추천, 파티 추천, 분산 처리 검증 지표를 명시한다.
  - 저장소 구조와 기존 협업 문서 링크를 모두 연결한다.
  - FastAPI 도입 여부와 최종 요구사항 정의서 등 미확정 항목을 미정 또는 작성 중으로 표기한다.
  jira_key: S15P21E106-58
  epic: S15P21E106-12
