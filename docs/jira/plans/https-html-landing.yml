tasks:
- id: https-html-landing
  issue_type: Task
  summary: '[인프라] HTML 랜딩 페이지 HTTPS 배포'
  description: 서비스 소개용 정적 HTML 랜딩 페이지를 제작하고 기존 서비스 서버의 Nginx를 통해 HTTPS로 공개한다. 기존 도메인 j15e106.p.ssafy.io를
    우선 대상으로 DNS, 서버 접근, 포트 및 기존 인증서 상태를 확인한 뒤 배포한다. React 앱 구현, 프론트엔드 초기 구성, React 연결 및 백엔드 기능 개발은 포함하지
    않는다. Nginx와 Compose 공통 설정은 관련 진행 업무 및 열린 MR과 중복을 확인하고 변경한다. 인증서 발급 도구와 개인키 보관·권한·갱신 방식은 기존 보안 규칙에
    맞게 확정한 뒤 적용한다. SP는 외부 서버 연동, HTTPS 구성, 인증서 갱신 및 배포 복구 검증을 고려해 5로 산정한다.
  area: 인프라
  story_points: 5
  done_when:
  - 서비스 소개용 정적 HTML 랜딩 페이지가 작성되고 모바일과 데스크톱에서 정상 표시된다.
  - 대상 도메인의 DNS, 서버 접근 권한, 80·443 포트 및 기존 서비스 영향이 확인된다.
  - Nginx가 도메인 루트 경로에서 랜딩 페이지와 정적 자원을 제공한다.
  - 유효한 TLS 인증서가 적용되어 외부 브라우저에서 인증서 경고 없이 HTTPS 접속된다.
  - HTTP 요청이 HTTPS로 전환되고 인증서 발급·갱신에 필요한 검증 경로가 유지된다.
  - 인증서 자동 갱신과 갱신 후 Nginx 반영 절차가 설정되고 검증된다.
  - 인증서 개인키와 서버 Secret이 저장소 및 이미지에 포함되지 않는다.
  - 페이지·정적 자원 응답과 재기동 후 동작을 확인하고 기존 서비스에 회귀가 없다.
  - 배포·검증·이전 설정 복구 절차와 인증서 운영 방법이 infra/README.md에 문서화된다.
  epic: S15P21E106-38
  jira_key: S15P21E106-196
