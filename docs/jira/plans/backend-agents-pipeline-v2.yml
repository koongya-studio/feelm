tasks:
- id: backend-agents-pipeline-v2
  issue_type: Task
  summary: '[백엔드] AI 작업 파이프라인 개정(backend AGENTS.md v2.1 채택)'
  description: 로컬 시범으로 검증한 개정안 v2.1을 backend/AGENTS.md의 정본 절차로 승격한다. 3장을 검증만·기본·게이트 세 단계와 트리거 목록으로 바꾸고,
    4장을 플랜·구현·리뷰 세 단계의 산출물과 완료 기준으로 바꾼다. 플랜에는 인수 테스트 목록과 기준선을, 리뷰에는 변경 단위별 읽기 범위와 측정 칸을 요구하며, 게이트 단계에서만
    플랜 승인과 분리 리뷰 두 지점에 사람이 개입한다. 리뷰 편성은 기본 단계 1명(W1), 게이트 단계 정합성·적대적 2명(W2)으로 나눈다. 플랜과 리뷰 템플릿을 docs/templates/에
    추가하고, 기존 4단계(테스트 선행 포함) 파이프라인을 참조하는 문서를 정리한다. 근거는 표본 5건(150 v0'·281 v0·151/283 v2.1-W1·282 v2.1-W2)의
    시범 측정이다.
  area: 백엔드
  epic: S15P21E106-69
  story_points: 3
  done_when:
  - backend/AGENTS.md 3장에서 검증만·기본·게이트 세 단계와 게이트 트리거 목록을 확인할 수 있다.
  - backend/AGENTS.md 4장이 플랜·구현·리뷰 세 단계의 산출물과 완료 기준으로 정의되어 있고, 플랜에 인수 테스트 목록과 기준선이 요구된다.
  - 게이트 단계에만 플랜 승인과 분리 리뷰 두 지점의 사람 개입이 정의되어 있고, 기본 단계는 W1, 게이트 단계는 W2 리뷰 편성을 따른다.
  - docs/templates/plan.md와 docs/templates/review.md가 있고 backend/AGENTS.md가 이를 참조한다.
  - 저장소 문서에 기존 4단계 파이프라인(테스트 선행)에 대한 잘못된 참조가 남아 있지 않다.
  jira_key: S15P21E106-313
