tasks:
- id: docs-role-boundaries
  issue_type: Task
  summary: '[협업] 규칙 문서 역할 경계와 우선순위 명시'
  description: 저장소 규칙·절차 문서의 역할 경계가 문서 안에 선언되어 있지 않아 같은 규칙이 여러 문서에 중복되고(-250에서 정리) 같은 수준 문서가 충돌할 때 기준이
    없다. docs/README.md에 문서별 역할 표(README는 실행 안내, convention은 코드 규칙, AGENTS.md는 AI 작업 절차, ai-collaboration.md는
    병렬 작업 조직)와 충돌 시 우선순위(규칙 문서가 README보다 우선)를 추가하고, 루트 AGENTS.md와 ai-collaboration.md 서문에 서로의 역할 분담을 한
    문장씩 선언한다. docs/README.md 색인에 빠진 db-schema-convention.md를 추가하고, 스토리 포인트 산정 기준이 docs/jira/README.md에
    있음을 색인 설명에 명시한다. -250(MR !75) 위에 쌓아 진행한다.
  area: 협업
  story_points: 2
  done_when:
  - docs/README.md에 규칙·절차 문서별 역할과 충돌 시 우선순위가 표로 정리되어 있다.
  - 루트 AGENTS.md와 docs/ai-collaboration.md 서문에서 두 문서의 역할 분담을 확인할 수 있다.
  - docs/README.md 색인에 db-schema-convention.md가 포함되고 Jira 자동화 문서 설명에 스토리 포인트 산정 기준 위치가 명시된다.
  - 문서 간 링크가 유효하다.
  jira_key: S15P21E106-252
  epic: S15P21E106-12
- id: backend-docs-rule-relocation
  issue_type: Task
  summary: '[백엔드] backend README의 구현 규칙을 컨벤션 문서로 이동'
  description: backend/README.md는 실행·빌드·Docker 안내 문서인데 패키지 구조, 공통 엔티티 선택 기준, ErrorCode 명명, SecurityConfig
    공개 경로 등록 규칙과 담당 도메인 표가 들어 있어 docs/backend-convention.md, docs/backend-role-assignment.md와 두 곳에서 어긋날
    위험이 있다. 규칙 성격의 내용을 backend-convention.md의 해당 장으로 이동·병합하고 README에는 링크만 남긴다. backend-convention.md 13장
    "AI 생성 코드 적용 규칙"은 루트 AGENTS.md·backend/AGENTS.md와 겹치므로 고유 내용만 backend/AGENTS.md 1장으로 흡수하고 13장은 참조로
    대체한다. backend/AGENTS.md 4장 파이프라인은 변경하지 않는다. 공통 문서 변경이라 백엔드 담당 3인 리뷰가 필요하다. -250(MR !75) 위에 쌓아 진행한다.
  area: 백엔드
  story_points: 3
  done_when:
  - backend/README.md에 실행·빌드·환경·Docker·상태 확인 안내만 남고 구현 규칙은 링크로 대체된다.
  - README에서 옮긴 규칙(공통 엔티티 선택, ErrorCode 명명과 API-000 갱신, 공개 경로 등록)이 backend-convention.md 해당 장에 1회씩 존재한다.
  - 담당 도메인 표는 backend-role-assignment.md에만 있고 README는 링크만 남긴다.
  - backend-convention.md 13장의 고유 규칙이 backend/AGENTS.md에 반영되고 13장은 참조로 대체된다.
  - backend/AGENTS.md 4장은 변경되지 않는다.
  jira_key: S15P21E106-254
  epic: S15P21E106-253
