tasks:
- id: distributed-runtime-contract
  issue_type: Task
  summary: '[설계] 분산 처리 기술 스택 및 실행환경 계약 확정'
  description: 채택된 HDFS·PySpark·Kafka와 EC2 2대 구성을 실제로 구축하기 전에 구성요소 간 호환 버전, 서버 역할, 포트, 네트워크, 영속 볼륨 및 실행
    방식을 확정한다. 기술 선택 자체를 재검토하거나 실제 클러스터를 구축하는 작업은 포함하지 않는다.
  epic: S15P21E106-38
  story_points: 3
  done_when:
  - Java, Python, Hadoop, Spark, PySpark 및 Kafka의 호환 버전 조합이 확정된다.
  - J15E106과 J15E106A의 NameNode, DataNode, Spark Master, Spark Worker 및 Kafka 역할이 기존 ADR과 일치하게 정리된다.
  - 구성요소별 내부·외부 포트와 서버 간 방화벽 허용 범위가 정의된다.
  - Docker Compose 네트워크, 서비스 이름 및 서버 간 접속 주소 규칙이 정의된다.
  - HDFS와 Kafka의 영속 볼륨 경로 및 데이터 보존 원칙이 정의된다.
  - 공통 환경변수, Secret 주입 방식, 헬스체크와 기동 순서가 문서화된다.
  jira_key: S15P21E106-133
- id: hdfs-two-node-cluster
  issue_type: Task
  summary: '[인프라] HDFS 2-Node 클러스터 구성'
  description: J15E106A의 NameNode·DataNode와 J15E106의 DataNode로 HDFS 2-Node 클러스터를 구성하고 분산 저장과 영속성을 단독 검증한다.
    Spark Job 실행은 이 업무에 포함하지 않는다.
  epic: S15P21E106-38
  story_points: 5
  done_when:
  - NameNode 1개와 DataNode 2개가 확정된 서버 역할과 네트워크로 기동된다.
  - HDFS 데이터와 NameNode 메타데이터가 서버별 영속 볼륨에 저장된다.
  - 두 DataNode가 NameNode에 정상 등록되고 관리 화면 또는 명령으로 상태를 확인할 수 있다.
  - 테스트 파일의 업로드, 조회, 다운로드 및 삭제가 정상 동작한다.
  - 컨테이너 또는 서버 재기동 후 HDFS 데이터와 메타데이터가 유지된다.
  - DataNode 한 개 중단 시 상태 변화와 복구 절차가 검증된다.
  - 구성, 실행, 점검 및 복구 방법이 infra/README.md에 문서화된다.
  jira_key: S15P21E106-134
- id: spark-master-worker-cluster
  issue_type: Task
  summary: '[인프라] Spark Master·Worker 분산 클러스터 구성'
  description: J15E106A의 Spark Master·Worker와 J15E106의 Spark Worker로 2-Worker 분산 클러스터를 구성하고 Spark 단독 분산
    실행 및 HDFS 접근을 검증한다. Kafka 이벤트 처리는 이 업무에 포함하지 않는다.
  epic: S15P21E106-38
  story_points: 5
  done_when:
  - Spark Master 1개와 Worker 2개가 확정된 서버 역할 및 자원 제한으로 기동된다.
  - 두 Worker가 Master에 등록되고 Web UI 또는 명령으로 자원과 상태를 확인할 수 있다.
  - PySpark Job이 두 Worker를 사용해 분산 실행된다.
  - Spark에서 HDFS의 테스트 데이터를 읽고 결과를 HDFS에 기록할 수 있다.
  - Worker 한 개 중단 시 Job 상태와 복구 절차가 검증된다.
  - 구성, 실행, 점검 및 복구 방법이 infra/README.md에 문서화된다.
  jira_key: S15P21E106-135
- id: kafka-kraft-broker
  issue_type: Task
  summary: '[인프라] Kafka KRaft Broker 구성'
  description: ZooKeeper 없이 KRaft 모드로 Kafka Broker·Controller를 구성하고 Topic 및 범용 Producer·Consumer의 메시지
    송수신과 데이터 영속성을 단독 검증한다. 추천 Consumer 구현은 S15P21E106-129에서 처리한다.
  epic: S15P21E106-38
  story_points: 5
  done_when:
  - Kafka Broker와 Controller가 KRaft 모드로 기동된다.
  - 컨테이너 내부 통신과 서버 간 접속을 위한 Listener 및 Advertised Listener가 구분된다.
  - Kafka 로그 데이터가 영속 볼륨에 저장된다.
  - 테스트 Topic 생성과 범용 Producer·Consumer 메시지 송수신이 정상 동작한다.
  - 재기동 후 Topic과 테스트 메시지가 유지되는지 확인된다.
  - S15P21E106-129가 사용할 Bootstrap Server, Topic 및 환경변수 계약이 정의된다.
  - 구성, 실행, 점검 및 복구 방법이 infra/README.md에 문서화된다.
  jira_key: S15P21E106-136
- id: spark-kafka-hdfs-integration
  issue_type: Task
  summary: '[인프라] Spark·Kafka·HDFS 통합 파이프라인 검증'
  description: 독립적으로 구성된 Kafka, Spark 및 HDFS를 연결해 테스트 이벤트가 Kafka에서 수신되고 Spark에서 처리된 뒤 HDFS에 저장되는 전체 흐름을
    검증한다. 개별 제품의 기본 설치와 추천 도메인 로직 구현은 포함하지 않는다.
  epic: S15P21E106-38
  story_points: 8
  done_when:
  - 테스트 이벤트를 Kafka Topic에 발행하고 Spark가 해당 이벤트를 수신한다.
  - Spark가 테스트 이벤트를 처리해 정해진 형식으로 HDFS에 저장한다.
  - HDFS에 저장된 결과 파일의 내용과 건수가 원본 이벤트와 일치하는지 확인된다.
  - 재시작 후 체크포인트 또는 오프셋을 기준으로 중복·누락 없이 처리를 재개하는 정책이 검증된다.
  - Kafka, Spark Worker 또는 HDFS DataNode의 일시 중단 시 실패 상태와 복구 절차가 확인된다.
  - 전체 실행 순서, 검증 명령, 로그 확인 위치 및 기본 장애 대응 절차가 문서화된다.
  - 성능 튜닝, 대규모 부하 시험, 운영 모니터링과 추천 로직 구현은 후속 업무 범위로 남는다.
  jira_key: S15P21E106-137
