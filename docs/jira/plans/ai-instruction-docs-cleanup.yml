tasks:
- id: ai-instruction-docs-cleanup
  issue_type: Task
  summary: '[협업] AI 지시 문서 중복 제거 및 보고 양식 정리'
  description: 루트 AGENTS.md, docs/ai-collaboration.md, docs/development-workflow.md에 3~4중으로 중복된 작업 시작
    전 확인 항목, 완료 보고 항목, 테스트 약화 금지 규칙을 한 곳에만 남기고 나머지는 참조로 대체한다. 대화 중 일회성 보고에 강제하던 고정 필드 양식은 요구 정보만 남기고 형식
    강제를 해제한다(MR 본문 템플릿은 유지). 루트 AGENTS.md 9장의 스토리 포인트 산정 규칙은 docs/jira/README.md에 이미 동일 내용이 있으므로 참조만 남긴다.
    Claude Code 개발자 Boris Cherny의 2026-07 YC 인터뷰(최신 모델에는 과제·가드레일·완료 기준만 남기고 방법 지시를 줄이라)를 참고했다. backend/AGENTS.md
    파이프라인은 범위에서 제외한다.
  area: 협업
  story_points: 2
  done_when:
  - 작업 시작 전 확인 항목과 완료 보고 항목이 문서 전체에서 한 곳에만 정의되고 다른 문서는 링크로 참조한다.
  - 테스트 약화 금지 규칙이 루트 AGENTS.md에만 있고 ai-collaboration.md에서 중복이 제거된다.
  - ai-collaboration.md의 시작 전·MR 전 고정 필드 코드블록이 삭제되거나 예시로 변경되고, 요구 정보 목록은 유지된다.
  - 루트 AGENTS.md 9장이 스토리 포인트 산정 세부 규칙 대신 docs/jira/README.md 참조로 축약된다.
  - 삭제된 규칙은 모두 남은 문서 어딘가에 정확히 1회 존재하며 문서 간 링크가 유효하다.
  jira_key: S15P21E106-250
  epic: S15P21E106-12
