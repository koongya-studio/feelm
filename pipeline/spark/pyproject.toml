[project]
name = "feelm-pipeline-spark"
version = "0.1.0"
description = "FEELM PySpark pipeline batch and streaming jobs"
requires-python = ">=3.10,<3.11"
dependencies = [
  "pandas==2.2.3",
  "psycopg[binary]==3.2.10",
  "pyarrow==19.0.1",
  "pyspark[ml]==4.1.3",
  "scikit-learn==1.6.1",
  "torch==2.6.0",
  "transformers==4.48.3",
  "xgboost-cpu==2.1.4",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.12.12",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false

# The Spark image has no GPU runtime.  Keep the embedding worker on PyTorch's
# CPU wheel index so resolving torch never adds CUDA/NVIDIA wheels.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
