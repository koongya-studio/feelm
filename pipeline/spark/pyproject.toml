[project]
name = "feelm-pipeline-spark"
version = "0.1.0"
description = "FEELM PySpark pipeline batch and streaming jobs"
requires-python = ">=3.10,<3.11"
dependencies = [
  "pyspark==4.1.3",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.12.12",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false
