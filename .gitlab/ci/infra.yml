ci-variable-contract-check:
  stage: verify
  tags: [e106-mr-isolated]
  dependencies: []
  variables:
    GIT_STRATEGY: none
  script:
    - python3 -I -B infra/scripts/ci-required-variable-preflight.py
  resource_group: ci-variable-contract-check
  interruptible: true
  timeout: 5m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'

ci-variable-preflight:
  stage: verify
  tags: [e106-shell]
  needs: []
  environment:
    name: service
    action: prepare
  script:
    - python3 -I -B infra/scripts/ci-required-variable-preflight.py --require-values --check-metadata
  resource_group: ci-variable-preflight
  interruptible: true
  timeout: 5m
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'

deploy-monitoring:
  stage: deploy
  tags: [e106-shell]
  needs: [ci-variable-preflight]
  environment:
    name: service
  script:
    - python3 -I -B infra/scripts/ci-deploy-current-commit.py --branch develop
    - bash infra/scripts/deploy-monitoring.sh
  resource_group: service-and-backend-cache
  interruptible: false
  retry:
    max: 2
    when: [runner_system_failure, scheduler_failure]
  timeout: 15m
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/infra.yml
        - infra/config/required-ci-variables.json
        - infra/compose/monitoring.yml
        - infra/monitoring/prometheus/**/*
        - infra/monitoring/grafana/**/*
        - infra/scripts/ci-deploy-current-commit.py
        - infra/scripts/test_ci_deploy_current_commit.py
        - infra/scripts/deploy-monitoring.sh
        - infra/scripts/test_deploy_monitoring.py
        - infra/scripts/verify-monitoring-deployment.py
        - infra/scripts/test_verify_monitoring_deployment.py

.deploy-hdfs-config:
  stage: deploy
  needs: []
  script:
    - /usr/bin/python3 -I -B infra/scripts/ci-deploy-current-commit.py
    - test -n "$HDFS_COMPOSE_ENV_FILE"
    - HDFS_COMPOSE_ENV_FILE="$HDFS_COMPOSE_ENV_FILE" bash infra/scripts/deploy-hdfs-config.sh "$HDFS_NODE" "$CI_COMMIT_SHA"
  resource_group: distributed-runtime-hdfs
  interruptible: false
  retry:
    max: 1
    when: [runner_system_failure, scheduler_failure]
  timeout: 30m
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - infra/compose/service.yml
        - infra/compose/distributed.yml
        - infra/hadoop/**/*
        - infra/scripts/deploy-distributed-runtime.py
        - infra/scripts/runtime-config-release.py
        - infra/scripts/deploy-hdfs-config.sh
      when: manual
  allow_failure: false

deploy-hdfs-service-config:
  extends: .deploy-hdfs-config
  tags: [e106-shell]
  environment:
    name: service
  variables:
    HDFS_NODE: service

deploy-hdfs-distributed-config:
  extends: .deploy-hdfs-config
  tags: [e106-distributed]
  needs: [deploy-hdfs-service-config]
  environment:
    name: distributed
  variables:
    HDFS_NODE: distributed

infra-config-test:
  stage: test
  tags: [e106-mr-isolated]
  dependencies: []
  variables:
    GIT_STRATEGY: none
  script:
    - python3 -I -B infra/scripts/run-infra-config-tests.py
  resource_group: infra-config-test
  interruptible: true
  timeout: 10m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/common.yml
        - .gitlab/ci/backend.yml
        - .gitlab/ci/frontend.yml
        - .gitlab/ci/consumer.yml
        - .gitlab/ci/infra.yml
        - infra/.env.example
        - infra/config/required-ci-variables.json
        - infra/compose/**/*
        - infra/hadoop/**/*
        - infra/kafka/**/*
        - infra/monitoring/**/*
        - infra/spark/**/*
        - infra/scripts/deploy-distributed-runtime.py
        - infra/scripts/runtime-config-release.py
        - infra/scripts/deploy-hdfs-config.sh
        - infra/scripts/test_runtime_config_release.py
        - infra/scripts/deploy-consumer.sh
        - infra/scripts/rollback-consumer.sh
        - infra/scripts/verify-consumer-e2e.py
        - infra/scripts/run-infra-config-tests.py
        - infra/scripts/notify-deployment.py
        - infra/scripts/test_notify_deployment.py
        - infra/scripts/ci-required-variable-preflight.py
        - infra/scripts/test_ci_required_variable_preflight.py
        - infra/scripts/ci-deploy-current-commit.py
        - infra/scripts/test_ci_deploy_current_commit.py
        - infra/scripts/deploy-monitoring.sh
        - infra/scripts/test_deploy_monitoring.py
        - infra/scripts/verify-monitoring-deployment.py
        - infra/scripts/test_verify_monitoring_deployment.py
        - infra/scripts/verify-kafka-monitoring.py
        - infra/scripts/test_consumer_distributed_deployment.py
        - infra/scripts/test_kafka_monitoring.py
        - infra/scripts/test_grafana_access_policy.py
        - infra/scripts/test_node_exporter_monitoring.py
        - infra/scripts/test_pipeline_observability.py
        - infra/scripts/test_verify_kafka_monitoring.py
        - infra/scripts/test_deploy_distributed_runtime.py
        - infra/scripts/test_deploy_consumer.py
        - infra/scripts/test_verify_consumer_e2e.py
        - infra/scripts/ci-infra-mr-*.py
        - infra/scripts/ci-gitlab-job-adapter.py
        - infra/scripts/ci-gitlab-custom-executor.py
        - infra/scripts/ci-gitlab-server-install.py
        - infra/scripts/ci-gitlab-adapter-update.py
        - infra/scripts/test_ci_infra_mr.py
        - infra/scripts/test_ci_gitlab_job_adapter.py
        - infra/scripts/test_ci_config.py
