.pipeline-mr-test:
  stage: test
  tags: [e106-mr-isolated]
  dependencies: []
  variables:
    GIT_STRATEGY: none
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes:
        - pipeline/spark/**/*.py
        - pipeline/spark/tests/**/*
        - pipeline/spark/pyproject.toml
        - pipeline/spark/uv.lock
        - pipeline/spark/.python-version
        - .gitlab-ci.yml
        - .gitlab/ci/common.yml
        - .gitlab/ci/pipeline.yml
        - .gitattributes
        - infra/scripts/ci-pipeline-mr-*.py
        - infra/scripts/test_ci_pipeline_mr.py
        - infra/scripts/ci-gitlab-job-adapter.py
        - infra/scripts/ci-gitlab-custom-executor.py
        - infra/scripts/ci-gitlab-server-install.py
        - infra/scripts/ci-bounded-output.py
        - infra/scripts/systemd/feelm-ci222-gitlab-runner.service
        - infra/scripts/test_ci_gitlab_job_adapter.py
        - infra/scripts/test_ci_config.py

pipeline-unit-test:
  extends: .pipeline-mr-test
  resource_group: pipeline-unit-test
  script:
    - cd pipeline/spark
    - uv sync --frozen
    - uv run ruff check .
    - uv run python -m ci_test_groups verify
    - uv run python -m ci_test_groups unit -vv --durations=20
    - uv run python -m jobs.batch.als_baseline --help
    - uv run python -m jobs.batch.parquet_roundtrip --help
  timeout: 15m

pipeline-spark-als-a-d-test:
  extends: .pipeline-mr-test
  when: manual
  allow_failure: false
  resource_group: pipeline-spark-als-a-d-test
  script:
    - cd pipeline/spark
    - uv sync --frozen
    - uv run python -m ci_test_groups spark-als-a-d -vv --durations=20
  timeout: 15m

pipeline-spark-als-e-z-test:
  extends: .pipeline-mr-test
  when: manual
  allow_failure: false
  resource_group: pipeline-spark-als-e-z-test
  script:
    - cd pipeline/spark
    - uv sync --frozen
    - uv run python -m ci_test_groups spark-als-e-z -vv --durations=20
  timeout: 15m

pipeline-spark-other-test:
  extends: .pipeline-mr-test
  when: manual
  allow_failure: false
  resource_group: pipeline-spark-other-test
  script:
    - cd pipeline/spark
    - uv sync --frozen
    - uv run python -m ci_test_groups spark-other -vv --durations=20
  timeout: 15m

spark-code-test:
  stage: test
  tags: [e106-shell]
  script:
    - python3 -B -m unittest infra.scripts.test_spark_code_delivery infra.scripts.test_spark_code_state infra.spark.test_spark_ml_runtime infra.scripts.test_deploy_distributed_runtime infra.scripts.test_runtime_config_release infra.scripts.test_notify_deployment -v
    - cd pipeline/spark
    - uv sync --frozen
    - uv run ruff check .
    - uv run python -m ci_test_groups verify
    - uv run python -m ci_test_groups unit -vv --durations=20
  interruptible: true
  timeout: 20m
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - pipeline/spark/**/*.py
        - pipeline/spark/pyproject.toml
        - pipeline/spark/uv.lock
        - pipeline/spark/.python-version
        - infra/spark/Dockerfile
        - infra/spark/Dockerfile.code
        - infra/spark/Dockerfile.code.dockerignore
        - infra/spark/requirements-ml.txt
        - infra/spark/runtime-image.env
        - infra/compose/service.yml
        - infra/compose/distributed.yml
        - infra/scripts/build-spark-code-image.sh
        - infra/scripts/deploy-spark-code.sh
        - infra/scripts/spark-code-state.py
        - infra/scripts/deploy-distributed-runtime.py
        - infra/scripts/runtime-config-release.py
        - infra/scripts/ci-deploy-current-commit.py
        - infra/scripts/test_spark_code_delivery.py
        - infra/scripts/test_spark_code_state.py
        - infra/scripts/test_deploy_distributed_runtime.py
        - infra/scripts/test_runtime_config_release.py
        - .gitlab/ci/pipeline.yml
        - .gitlab/ci/infra.yml

spark-code-image:
  stage: build
  tags: [e106-shell]
  needs: [spark-code-test]
  variables:
    DOCKER_CONFIG: "$CI_PROJECT_DIR/.docker-spark-code-$CI_JOB_ID"
  before_script:
    - install -d -m 0700 "$DOCKER_CONFIG"
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - test "$(grep -c '^SPARK_RUNTIME_IMAGE=' infra/spark/runtime-image.env)" -eq 1
    - SPARK_RUNTIME_IMAGE="$(sed -n 's/^SPARK_RUNTIME_IMAGE=//p' infra/spark/runtime-image.env)"
    - SPARK_CODE_IMAGE="$DOCKERHUB_NAMESPACE/feelm-spark:$CI_COMMIT_SHA"
    - bash infra/scripts/build-spark-code-image.sh "$SPARK_RUNTIME_IMAGE" "$SPARK_CODE_IMAGE" "$CI_COMMIT_SHA" spark-code-image.env
  after_script:
    - docker logout >/dev/null 2>&1 || true
    - rm -f "$DOCKER_CONFIG/config.json"
    - rmdir "$DOCKER_CONFIG" 2>/dev/null || true
  artifacts:
    reports:
      dotenv: spark-code-image.env
    expire_in: 1 day
  interruptible: true
  timeout: 30m
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - pipeline/spark/**/*.py
        - pipeline/spark/pyproject.toml
        - pipeline/spark/uv.lock
        - pipeline/spark/.python-version
        - infra/spark/Dockerfile
        - infra/spark/Dockerfile.code
        - infra/spark/Dockerfile.code.dockerignore
        - infra/spark/requirements-ml.txt
        - infra/spark/runtime-image.env
        - infra/compose/service.yml
        - infra/compose/distributed.yml
        - infra/scripts/build-spark-code-image.sh
        - infra/scripts/deploy-spark-code.sh
        - infra/scripts/spark-code-state.py
        - infra/scripts/deploy-distributed-runtime.py
        - infra/scripts/runtime-config-release.py
        - infra/scripts/ci-deploy-current-commit.py
        - infra/scripts/test_spark_code_delivery.py
        - infra/scripts/test_spark_code_state.py
        - infra/scripts/test_deploy_distributed_runtime.py
        - infra/scripts/test_runtime_config_release.py
        - .gitlab/ci/pipeline.yml
        - .gitlab/ci/infra.yml
