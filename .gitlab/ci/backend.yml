datastore-config-check:
  stage: verify
  tags: [e106-shell]
  script:
    - bash ./infra/scripts/verify-datastore-config.sh
  interruptible: true
  timeout: 10m
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/common.yml
        - .gitlab/ci/backend.yml
        - infra/compose/service.yml
        - infra/redis/**/*
        - infra/scripts/verify-datastore-config.sh
        - infra/scripts/verify-datastores.sh
        - infra/scripts/deploy-backend.sh
        - infra/scripts/rollback-backend.sh

backend-cache-prepare:
  stage: verify
  tags: [e106-mr-isolated]
  variables:
    GIT_STRATEGY: none
  script:
    - echo Prepare verified backend dependency cache for this MR revision
  resource_group: service-and-backend-cache
  interruptible: true
  timeout: 60m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes:
        - backend/build.gradle
        - backend/build.gradle.kts
        - backend/settings.gradle
        - backend/settings.gradle.kts
        - backend/gradle.properties
        - backend/gradle/libs.versions.toml
        - backend/gradle/wrapper/gradle-wrapper.properties

backend-mr-test:
  stage: test
  tags: [e106-mr-isolated]
  dependencies: []
  variables:
    GIT_STRATEGY: none
  script:
    - cd backend
    - ./gradlew clean test spotlessCheck --no-daemon
  resource_group: service-and-backend-cache
  interruptible: true
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes:
        - backend/src/**/*
        - backend/scripts/**/*
        - backend/gradle/**/*
        - backend/build.gradle
        - backend/build.gradle.kts
        - backend/settings.gradle
        - backend/settings.gradle.kts
        - backend/gradle.properties
        - backend/gradlew*
        - backend/Dockerfile*
        - backend/.*
        - .gitlab-ci.yml
        - .gitlab/ci/common.yml
        - .gitlab/ci/backend.yml
        - .gitattributes
        - infra/scripts/ci-gitlab-custom-executor.py
        - infra/scripts/ci-gitlab-job-adapter.py
        - infra/scripts/ci-bounded-output.py
        - infra/scripts/ci-network-guard.py
        - infra/scripts/ci-job-*.py
        - infra/scripts/test_ci_gitlab_job_adapter.py
        - infra/scripts/test_ci_config.py
        - infra/scripts/test_ci_backend_mr_paths.py
        - infra/scripts/test_ci_backend_develop_paths.py
        - infra/scripts/ci-local-backend-*.py
        - infra/scripts/ci-server-manager-pilot.py
        - infra/scripts/rootless-backend/**/*
        - infra/scripts/systemd/feelm-ci*.service

.backend-cache-action:
  stage: verify
  tags: [e106-shell]
  variables:
    GIT_STRATEGY: fetch
  resource_group: service-and-backend-cache
  script:
    - /usr/bin/python3 -I -B infra/scripts/ci-dependency-cache-context.py | sudo -n /usr/bin/python3 -I -B /usr/local/lib/feelm-ci222/gitlab/ci-dependency-cache.py
  allow_failure: false

backend-cache-promote:
  extends: .backend-cache-action
  variables:
    CACHE_ACTION: promote
  timeout: 10m
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - backend/build.gradle
        - backend/build.gradle.kts
        - backend/settings.gradle
        - backend/settings.gradle.kts
        - backend/gradle.properties
        - backend/gradle/libs.versions.toml
        - backend/gradle/wrapper/gradle-wrapper.properties

backend-cache-rollback:
  extends: .backend-cache-action
  variables:
    CACHE_ACTION: rollback
  timeout: 10m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CACHE_ACTION == "rollback"'
      when: manual

backend-test:
  stage: test
  tags: [e106-shell]
  script:
    - python3 -B -m unittest infra.scripts.test_ci_config infra.scripts.test_ci_backend_mr_paths infra.scripts.test_ci_backend_develop_paths infra.scripts.test_ci_deploy_current_commit infra.scripts.test_deploy_backend infra.scripts.test_deploy_frontend -v
    - cd backend
    - ./gradlew clean test spotlessCheck --no-daemon --init-script gradle/test-timing.gradle
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CLAUDE_REVIEW_TRIGGER == "comment"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - backend/src/**/*
        - backend/gradle/**/*
        - backend/build.gradle
        - backend/build.gradle.kts
        - backend/settings.gradle
        - backend/settings.gradle.kts
        - backend/gradle.properties
        - backend/gradlew*
        - backend/Dockerfile*
        - backend/.dockerignore
        - infra/compose/service.yml
        - infra/redis/**/*
        - infra/scripts/verify-datastore-config.sh
        - infra/scripts/verify-datastores.sh
        - infra/scripts/deploy-backend.sh
        - infra/scripts/rollback-backend.sh
        - infra/scripts/test_deploy_backend.py
        - infra/scripts/ci-deploy-current-commit.py
        - infra/scripts/test_ci_deploy_current_commit.py
        - .gitlab-ci.yml
        - .gitlab/ci/common.yml
        - .gitlab/ci/backend.yml
        - .gitattributes
        - infra/scripts/test_ci_config.py
        - infra/scripts/test_ci_backend_develop_paths.py

backend-image:
  stage: build
  tags: [e106-shell]
  needs:
    - job: backend-test
    - job: datastore-config-check
      optional: true
  before_script:
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - BACKEND_IMAGE="$DOCKERHUB_NAMESPACE/feelm-backend:$CI_COMMIT_SHA"
    - docker build --pull -t "$BACKEND_IMAGE" ./backend
    - docker push "$BACKEND_IMAGE"
    - echo "Built backend image $BACKEND_IMAGE"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CLAUDE_REVIEW_TRIGGER == "comment"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - backend/src/**/*
        - backend/gradle/**/*
        - backend/build.gradle
        - backend/build.gradle.kts
        - backend/settings.gradle
        - backend/settings.gradle.kts
        - backend/gradle.properties
        - backend/gradlew*
        - backend/Dockerfile*
        - backend/.dockerignore
        - infra/compose/service.yml
        - infra/redis/**/*
        - infra/scripts/verify-datastore-config.sh
        - infra/scripts/verify-datastores.sh
        - infra/scripts/deploy-backend.sh
        - infra/scripts/rollback-backend.sh
        - infra/scripts/test_deploy_backend.py
        - infra/scripts/ci-deploy-current-commit.py
        - infra/scripts/test_ci_deploy_current_commit.py
        - .gitlab-ci.yml
        - .gitlab/ci/common.yml
        - .gitlab/ci/backend.yml
        - .gitattributes

deploy-backend:
  stage: deploy
  tags: [e106-shell]
  needs: [backend-image]
  resource_group: service-and-backend-cache
  environment:
    name: service
  before_script:
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - /usr/bin/python3 -I -B infra/scripts/ci-deploy-current-commit.py
    - BACKEND_IMAGE="$DOCKERHUB_NAMESPACE/feelm-backend:$CI_COMMIT_SHA"
    - ./infra/scripts/deploy-backend.sh "$BACKEND_IMAGE"
  retry:
    max: 2
    when: [runner_system_failure, scheduler_failure]
  timeout: 15m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CLAUDE_REVIEW_TRIGGER == "comment"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - backend/src/**/*
        - backend/gradle/**/*
        - backend/build.gradle
        - backend/build.gradle.kts
        - backend/settings.gradle
        - backend/settings.gradle.kts
        - backend/gradle.properties
        - backend/gradlew*
        - backend/Dockerfile*
        - backend/.dockerignore
        - infra/compose/service.yml
        - infra/redis/**/*
        - infra/scripts/verify-datastore-config.sh
        - infra/scripts/verify-datastores.sh
        - infra/scripts/deploy-backend.sh
        - infra/scripts/rollback-backend.sh
        - infra/scripts/test_deploy_backend.py
        - infra/scripts/ci-deploy-current-commit.py
        - infra/scripts/test_ci_deploy_current_commit.py
        - .gitlab-ci.yml
        - .gitlab/ci/common.yml
        - .gitlab/ci/backend.yml
        - .gitattributes
  allow_failure: false
