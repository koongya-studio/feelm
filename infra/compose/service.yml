services:
  nginx:
    image: nginx:alpine
    container_name: feelm-nginx
    restart: unless-stopped

    ports:
      - "${NGINX_PORT:-80}:80"
      - "443:443"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../frontend/landing:/usr/share/nginx/html:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /run/feelm-claude-review:/run/feelm-claude-review:ro
      - ${SWAGGER_HTPASSWD_PATH:-/dev/null}:/run/secrets/swagger_htpasswd:ro
      - ${GRAFANA_HTPASSWD_PATH:-/dev/null}:/run/secrets/grafana_htpasswd:ro
      - ${AVATAR_HOST_PATH:-/srv/feelm/data/avatars}:/var/www/avatars:ro

    depends_on:
      frontend:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-feelm-frontend:local}
    container_name: feelm-frontend
    restart: unless-stopped

    mem_limit: 256m

  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    container_name: feelm-postgres
    restart: unless-stopped

    # Loopback by default. Set POSTGRES_BIND_ADDRESS to SERVICE_NODE_IP only
    # when the distributed-node /32 firewall rule is installed.
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
      TZ: UTC

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.2.9-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
    container_name: feelm-redis
    restart: unless-stopped

    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:6379:6379"

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_READONLY_PASSWORD: ${REDIS_READONLY_PASSWORD:-}
      REDIS_LOCAL_BACKEND_PASSWORD: ${REDIS_LOCAL_BACKEND_PASSWORD:-}

    command: ["sh", "/usr/local/etc/redis/start.sh"]

    volumes:
      - redis_data:/data
      - ${REDIS_CONFIG_DIR:-../redis}/start.sh:/usr/local/etc/redis/start.sh:ro
      - ${REDIS_CONFIG_DIR:-../redis}/readonly.acl:/usr/local/etc/redis/readonly.acl:ro
      - ${REDIS_CONFIG_DIR:-../redis}/local-backend.acl:/usr/local/etc/redis/local-backend.acl:ro

    mem_limit: 768m

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli --no-auth-warning ping | grep -q PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: feelm-backend
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: dev
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # 서버 백엔드는 기존 전체 권한 계정을 유지한다. 제한 계정은 호스트에서 실행하는 로컬 프로파일 전용이다.
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      KAFKA_BOOTSTRAP_SERVERS: "${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}:9092"
      KAFKA_OUTBOX_POLL_INTERVAL: ${KAFKA_OUTBOX_POLL_INTERVAL:-500ms}
      KAFKA_OUTBOX_BATCH_SIZE: ${KAFKA_OUTBOX_BATCH_SIZE:-100}
      KAFKA_OUTBOX_MAX_RETRY_DELAY: ${KAFKA_OUTBOX_MAX_RETRY_DELAY:-30s}
      KAFKA_OUTBOX_PUBLISHED_RETENTION: ${KAFKA_OUTBOX_PUBLISHED_RETENTION:-7d}
      KAFKA_OUTBOX_CLEANUP_INTERVAL: ${KAFKA_OUTBOX_CLEANUP_INTERVAL:-1h}
      GBT_XAI_ENABLED: ${GBT_XAI_ENABLED:-false}
      GMS_KEY: ${GMS_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      AUTH_MOCK_ENABLED: ${AUTH_MOCK_ENABLED:-false}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL is required}
      OAUTH_ALLOWED_REDIRECT_URIS: ${OAUTH_ALLOWED_REDIRECT_URIS:?OAUTH_ALLOWED_REDIRECT_URIS is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?KAKAO_CLIENT_ID is required}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?KAKAO_CLIENT_SECRET is required}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:?NAVER_CLIENT_ID is required}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:?NAVER_CLIENT_SECRET is required}
      AVATAR_STORAGE_PATH: /data/avatars
      AVATAR_PUBLIC_URL_PREFIX: ${AVATAR_PUBLIC_URL_PREFIX:-/media/avatars}
      REPORT_IMAGE_STORAGE_PATH: /data/report-images
      REPORT_IMAGE_SIGNING_SECRET: ${REPORT_IMAGE_SIGNING_SECRET:?REPORT_IMAGE_SIGNING_SECRET is required}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}

      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME}}
      MAIL_RATE_LIMIT_EMAIL_INTERVAL: ${MAIL_RATE_LIMIT_EMAIL_INTERVAL:-1m}
      MAIL_RATE_LIMIT_IP_LIMIT: ${MAIL_RATE_LIMIT_IP_LIMIT:-30}
      MAIL_RATE_LIMIT_IP_WINDOW: ${MAIL_RATE_LIMIT_IP_WINDOW:-1h}
      MAIL_SEND_BUDGET_HOURLY_LIMIT: ${MAIL_SEND_BUDGET_HOURLY_LIMIT:-100}
      MAIL_SEND_BUDGET_DAILY_LIMIT: ${MAIL_SEND_BUDGET_DAILY_LIMIT:-300}
      WEB_PUSH_MODE: ${WEB_PUSH_MODE:-disabled}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      WEB_PUSH_POLL_INTERVAL: ${WEB_PUSH_POLL_INTERVAL:-1s}
      WEB_PUSH_BATCH_SIZE: ${WEB_PUSH_BATCH_SIZE:-25}
      WEB_PUSH_MAXIMUM_ATTEMPTS: ${WEB_PUSH_MAXIMUM_ATTEMPTS:-5}
      WEB_PUSH_INITIAL_RETRY_DELAY: ${WEB_PUSH_INITIAL_RETRY_DELAY:-1m}
      WEB_PUSH_MAXIMUM_RETRY_DELAY: ${WEB_PUSH_MAXIMUM_RETRY_DELAY:-1h}
      WEB_PUSH_LEASE_DURATION: ${WEB_PUSH_LEASE_DURATION:-2m}
      WEB_PUSH_REQUEST_TIMEOUT: ${WEB_PUSH_REQUEST_TIMEOUT:-15s}

    volumes:
      - ${AVATAR_HOST_PATH:-/srv/feelm/data/avatars}:/data/avatars
      # 비공개 리포트 PNG는 Backend에만 연결한다. Nginx 정적 볼륨으로 마운트하지 않는다.
      - ${REPORT_IMAGE_HOST_PATH:-/srv/feelm/data/report-images}:/data/report-images

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:8080/actuator/health > /dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  hdfs-datanode-1:
    image: apache/hadoop:3.4.3
    container_name: feelm-hdfs-datanode-1
    hostname: hdfs-datanode-1
    restart: unless-stopped
    network_mode: host

    extra_hosts:
      - "hdfs-namenode:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-datanode-1:${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}"
      - "hdfs-datanode-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

    environment:
      HDFS_DATANODE_OPTS: "-Ddfs.datanode.hostname=hdfs-datanode-1"

    volumes:
      - ../hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ../hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs_datanode_1:/data/hdfs/datanode

    command: ["hdfs", "datanode"]

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9864'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  spark-worker-1:
    image: ${SPARK_IMAGE:-feelm-spark-ml:4.1.3-numpy2.2.6}
    build:
      context: ../spark
      dockerfile: Dockerfile
    container_name: feelm-spark-worker-1
    hostname: spark-worker-1
    restart: unless-stopped
    network_mode: host

    extra_hosts:
      - "spark-master:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "spark-worker-1:${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}"
      - "hdfs-namenode:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-datanode-1:${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}"
      - "hdfs-datanode-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

    volumes:
      - ../spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

    entrypoint:
      - /opt/spark/bin/spark-class

    command:
      - org.apache.spark.deploy.worker.Worker
      - --host
      - ${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}
      - --port
      - "7078"
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - "4g"
      - spark://spark-master:7077

volumes:
  postgres_data:
  redis_data:
  hdfs_datanode_1:
