services:
  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: feelm-prometheus
    restart: unless-stopped

    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}

    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    extra_hosts:
      - "feelm-distributed-node:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

  grafana:
    image: grafana/grafana:13.1.0
    container_name: feelm-grafana
    restart: unless-stopped

    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: feelm-node-exporter
    restart: unless-stopped
    pid: host

    command:
      - --path.rootfs=/host

    volumes:
      - /:/host:ro,rslave

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: feelm-postgres-exporter
    restart: unless-stopped

    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  redis-exporter:
    image: oliver006/redis_exporter:v1.91.1
    container_name: feelm-redis-exporter
    restart: unless-stopped

    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

volumes:
  prometheus_data:
  grafana_data:
