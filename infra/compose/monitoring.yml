services:
  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: feelm-prometheus
    restart: unless-stopped

    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}

    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    extra_hosts:
      - "feelm-distributed-node:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

  grafana:
    image: grafana/grafana:13.1.0
    container_name: feelm-grafana
    restart: unless-stopped

    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://j15e106.p.ssafy.io/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-true}
      GRAFANA_ALERT_HMAC_SECRET: ${GRAFANA_ALERT_HMAC_SECRET:?GRAFANA_ALERT_HMAC_SECRET is required}

    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      prometheus:
        condition: service_started
      mattermost-alert-relay:
        condition: service_healthy

  mattermost-alert-relay:
    image: python:3.13.7-alpine3.22
    container_name: feelm-mattermost-alert-relay
    restart: unless-stopped
    read_only: true
    user: "65532:65532"

    ports:
      - "127.0.0.1:${GRAFANA_ALERT_RELAY_PORT:-9087}:8080"

    environment:
      GRAFANA_ALERT_HMAC_SECRET: ${GRAFANA_ALERT_HMAC_SECRET:?GRAFANA_ALERT_HMAC_SECRET is required}
      MATTERMOST_BASE_URL: ${MATTERMOST_BASE_URL:?MATTERMOST_BASE_URL is required}
      MATTERMOST_LOGIN_ID: ${MATTERMOST_LOGIN_ID:?MATTERMOST_LOGIN_ID is required}
      MATTERMOST_PASSWORD: ${MATTERMOST_PASSWORD:?MATTERMOST_PASSWORD is required}
      MATTERMOST_CHANNEL_ID: ${MATTERMOST_CHANNEL_ID:-}
      MATTERMOST_TEAM_NAME: ${MATTERMOST_TEAM_NAME:-}
      MATTERMOST_CHANNEL_NAME: ${MATTERMOST_CHANNEL_NAME:-}

    command: ["python", "-I", "-B", "/app/relay.py"]

    volumes:
      - ../monitoring/mattermost-relay/relay.py:/app/relay.py:ro

    tmpfs:
      - /tmp:size=1m,mode=1777

    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: feelm-node-exporter
    restart: unless-stopped
    pid: host

    command:
      - --path.rootfs=/host

    volumes:
      - /:/host:ro,rslave

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: feelm-postgres-exporter
    restart: unless-stopped

    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  redis-exporter:
    image: oliver006/redis_exporter:v1.91.1
    container_name: feelm-redis-exporter
    restart: unless-stopped

    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

volumes:
  prometheus_data:
    name: compose_prometheus_data
  grafana_data:
    name: compose_grafana_data

networks:
  default:
    name: compose_default
    external: true
