services:
  hdfs-namenode-init:
    image: apache/hadoop:3.4.3
    container_name: feelm-hdfs-namenode-init
    network_mode: host

    extra_hosts:
      - "hdfs-namenode:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-datanode-1:${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}"
      - "hdfs-datanode-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

    volumes:
      - ../hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ../hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs_namenode:/data/hdfs/namenode

    command: ["hdfs", "namenode", "-format", "-nonInteractive", "feelm"]
    restart: "no"
    profiles:
      - init

  hdfs-namenode:
    image: apache/hadoop:3.4.3
    container_name: feelm-hdfs-namenode
    hostname: hdfs-namenode
    restart: unless-stopped
    network_mode: host

    extra_hosts:
      - "hdfs-namenode:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-datanode-1:${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}"
      - "hdfs-datanode-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

    volumes:
      - ../hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ../hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs_namenode:/data/hdfs/namenode

    command: ["hdfs", "namenode"]

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9870 && echo > /dev/tcp/127.0.0.1/8020'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  hdfs-datanode-2:
    image: apache/hadoop:3.4.3
    container_name: feelm-hdfs-datanode-2
    hostname: hdfs-datanode-2
    restart: unless-stopped
    network_mode: host

    extra_hosts:
      - "hdfs-namenode:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-datanode-1:${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}"
      - "hdfs-datanode-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

    environment:
      HDFS_DATANODE_OPTS: "-Ddfs.datanode.hostname=hdfs-datanode-2"

    volumes:
      - ../hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ../hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs_datanode_2:/data/hdfs/datanode

    command: ["hdfs", "datanode"]

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9864'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  spark-master:
    image: ${SPARK_IMAGE:-feelm-spark-ml:4.1.3-numpy2.2.6}
    build:
      context: ../spark
      dockerfile: Dockerfile
    container_name: feelm-spark-master
    hostname: spark-master
    restart: unless-stopped
    network_mode: host

    extra_hosts:
      - "spark-master:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-namenode:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-datanode-1:${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}"
      - "hdfs-datanode-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

    volumes:
      - ../spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

    entrypoint:
      - /opt/spark/bin/spark-class

    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - ${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}
      - --port
      - "7077"
      - --webui-port
      - "8080"

  spark-worker-2:
    image: ${SPARK_IMAGE:-feelm-spark-ml:4.1.3-numpy2.2.6}
    build:
      context: ../spark
      dockerfile: Dockerfile
    container_name: feelm-spark-worker-2
    hostname: spark-worker-2
    restart: unless-stopped
    network_mode: host

    extra_hosts:
      - "spark-master:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "spark-worker-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-namenode:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-datanode-1:${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}"
      - "hdfs-datanode-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

    volumes:
      - ../spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

    entrypoint:
      - /opt/spark/bin/spark-class

    command:
      - org.apache.spark.deploy.worker.Worker
      - --host
      - ${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}
      - --port
      - "7078"
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - "4g"
      - spark://spark-master:7077

  spark-history-init:
    image: apache/hadoop:3.4.3
    container_name: feelm-spark-history-init
    network_mode: host
    profiles:
      - init

    extra_hosts:
      - "hdfs-namenode:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

    volumes:
      - ../hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro

    command:
      - sh
      - -c
      - hdfs dfsadmin -safemode wait && hdfs dfs -mkdir -p /spark-events && hdfs dfs -chmod 1777 /spark-events
    restart: "no"

    depends_on:
      hdfs-namenode:
        condition: service_healthy

  spark-history-server:
    image: ${SPARK_IMAGE:-feelm-spark-ml:4.1.3-numpy2.2.6}
    build:
      context: ../spark
      dockerfile: Dockerfile
    container_name: feelm-spark-history-server
    hostname: spark-history-server
    restart: unless-stopped
    labels:
      io.feelm.spark-history.revision: ${SPARK_HISTORY_DEPLOY_REVISION:-manual}
    network_mode: host

    extra_hosts:
      - "spark-history-server:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-namenode:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-datanode-1:${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}"
      - "hdfs-datanode-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

    environment:
      SPARK_LOCAL_IP: ${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=hdfs://hdfs-namenode:8020/spark-events
        -Dspark.history.ui.port=18080

    volumes:
      - ../hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ../hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ../spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

    entrypoint:
      - /opt/spark/bin/spark-class

    command:
      - org.apache.spark.deploy.history.HistoryServer

    depends_on:
      hdfs-namenode:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.3.1
    container_name: feelm-kafka
    restart: unless-stopped
    network_mode: host

    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"

      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}:9092"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}:9093"

      CLUSTER_ID: "${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID is required}"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: feelm-kafka-exporter
    restart: unless-stopped
    labels:
      io.feelm.distributed-observability.revision: ${OBSERVABILITY_DEPLOY_REVISION:-manual}
    network_mode: host
    read_only: true

    command:
      - --kafka.server=127.0.0.1:9092
      - --web.listen-address=${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}:9308
      - --topic.filter=^feelm[.].+$
      - --group.filter=^feelm[-.].+$
      - --refresh.metadata=30s
      - --topic.workers=10
      - --no-concurrent.enable

    depends_on:
      kafka:
        condition: service_started

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: feelm-kafka-ui
    restart: unless-stopped
    labels:
      io.feelm.distributed-observability.revision: ${OBSERVABILITY_DEPLOY_REVISION:-manual}
    network_mode: host
    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    environment:
      SERVER_ADDRESS: ${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}
      SERVER_PORT: "8082"
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: feelm
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 127.0.0.1:9092
      KAFKA_CLUSTERS_0_READONLY: "true"

    depends_on:
      kafka:
        condition: service_started

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  consumer:
    image: ${CONSUMER_IMAGE:-feelm-foldin-consumer:local}
    build:
      context: ../../pipeline/consumer
      dockerfile: Dockerfile
    container_name: feelm-foldin-consumer
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 30s
    profiles:
      - consumer

    extra_hosts:
      - "hdfs-namenode:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-datanode-1:${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}"
      - "hdfs-datanode-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

    environment:
      CONSUMER_KAFKA_BOOTSTRAP_SERVERS: "${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}:9092"
      CONSUMER_KAFKA_TOPIC: ${CONSUMER_KAFKA_TOPIC:-feelm.rating.v1}
      CONSUMER_DISMISS_KAFKA_TOPIC: ${CONSUMER_DISMISS_KAFKA_TOPIC:-feelm.dismiss.v1}
      CONSUMER_KAFKA_GROUP_ID: ${CONSUMER_KAFKA_GROUP_ID:-feelm-foldin-consumer-v1}
      CONSUMER_POSTGRES_DSN: ${CONSUMER_POSTGRES_DSN:-}
      CONSUMER_REDIS_URL: ${CONSUMER_REDIS_URL:-}
      CONSUMER_MODEL_URI: ${CONSUMER_MODEL_URI:-}
      CONSUMER_MAPPING_URI: ${CONSUMER_MAPPING_URI:-}
      CONSUMER_METADATA_URI: ${CONSUMER_METADATA_URI:-}
      CONSUMER_CONTENT_URI: ${CONSUMER_CONTENT_URI:-}
      CONSUMER_GROUP_URI: ${CONSUMER_GROUP_URI:-}
      CONSUMER_DISCOVERY_POPULARITY_URI: ${CONSUMER_DISCOVERY_POPULARITY_URI:-}
      CONSUMER_HYBRID_ALPHA: ${CONSUMER_HYBRID_ALPHA:-0.5}
      CONSUMER_DISMISS_SCORE: ${CONSUMER_DISMISS_SCORE:-1.0}
      CONSUMER_DISMISS_INPUT_VERSION: ${CONSUMER_DISMISS_INPUT_VERSION:-dismiss-virtual-rating-v1}
      CONSUMER_RETRY_ATTEMPTS: ${CONSUMER_RETRY_ATTEMPTS:-3}
      CONSUMER_RETRY_BACKOFF_SECONDS: ${CONSUMER_RETRY_BACKOFF_SECONDS:-0.25}
      CONSUMER_KAFKA_POLL_TIMEOUT_SECONDS: ${CONSUMER_KAFKA_POLL_TIMEOUT_SECONDS:-1.0}
      CONSUMER_MAX_PAUSED_POLLS: ${CONSUMER_MAX_PAUSED_POLLS:-30}

    depends_on:
      hdfs-namenode:
        condition: service_healthy
      kafka:
        condition: service_started

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  party-consumer:
    image: ${CONSUMER_IMAGE:-feelm-foldin-consumer:local}
    build:
      context: ../../pipeline/consumer
      dockerfile: Dockerfile
    container_name: feelm-party-consumer
    command: ["/app/.venv/bin/python", "-m", "feelm_consumer.party_main"]
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 30s
    profiles:
      - party-consumer

    extra_hosts:
      - "hdfs-namenode:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-datanode-1:${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}"
      - "hdfs-datanode-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

    environment:
      PARTY_CONSUMER_KAFKA_BOOTSTRAP_SERVERS: "${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}:9092"
      PARTY_CONSUMER_KAFKA_TOPIC: ${PARTY_CONSUMER_KAFKA_TOPIC:-feelm.party-refresh.v1}
      PARTY_CONSUMER_KAFKA_GROUP_ID: ${PARTY_CONSUMER_KAFKA_GROUP_ID:-feelm-party-consumer-v1}
      PARTY_CONSUMER_REDIS_URL: ${PARTY_CONSUMER_REDIS_URL:-}
      PARTY_CONSUMER_MODEL_URI: ${PARTY_CONSUMER_MODEL_URI:-}
      PARTY_CONSUMER_MAPPING_URI: ${PARTY_CONSUMER_MAPPING_URI:-}
      PARTY_CONSUMER_METADATA_URI: ${PARTY_CONSUMER_METADATA_URI:-}
      PARTY_CONSUMER_RETRY_ATTEMPTS: ${PARTY_CONSUMER_RETRY_ATTEMPTS:-3}
      PARTY_CONSUMER_RETRY_BACKOFF_SECONDS: ${PARTY_CONSUMER_RETRY_BACKOFF_SECONDS:-0.25}
      PARTY_CONSUMER_KAFKA_POLL_TIMEOUT_SECONDS: ${PARTY_CONSUMER_KAFKA_POLL_TIMEOUT_SECONDS:-1.0}
      PARTY_CONSUMER_MAX_PAUSED_POLLS: ${PARTY_CONSUMER_MAX_PAUSED_POLLS:-30}

    depends_on:
      hdfs-namenode:
        condition: service_healthy
      kafka:
        condition: service_started

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: feelm-node-exporter-distributed
    restart: unless-stopped
    labels:
      io.feelm.distributed-observability.revision: ${OBSERVABILITY_DEPLOY_REVISION:-manual}
    pid: host
    read_only: true

    ports:
      - "${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}:9100:9100"

    command:
      - --path.rootfs=/host

    volumes:
      - /:/host:ro,rslave

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

volumes:
  hdfs_namenode:
  hdfs_datanode_2:
  kafka_data:
