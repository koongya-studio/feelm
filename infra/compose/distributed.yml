services:
  hdfs-namenode-init:
    image: apache/hadoop:3.4.3
    container_name: feelm-hdfs-namenode-init
    network_mode: host

    extra_hosts:
      - "hdfs-namenode:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-datanode-1:${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}"
      - "hdfs-datanode-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

    volumes:
      - ../hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ../hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs_namenode:/data/hdfs/namenode

    command: ["hdfs", "namenode", "-format", "-nonInteractive", "feelm"]
    restart: "no"
    profiles:
      - init

  hdfs-namenode:
    image: apache/hadoop:3.4.3
    container_name: feelm-hdfs-namenode
    hostname: hdfs-namenode
    restart: unless-stopped
    network_mode: host

    extra_hosts:
      - "hdfs-namenode:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-datanode-1:${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}"
      - "hdfs-datanode-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

    volumes:
      - ../hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ../hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs_namenode:/data/hdfs/namenode

    command: ["hdfs", "namenode"]

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9870'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  hdfs-datanode-2:
    image: apache/hadoop:3.4.3
    container_name: feelm-hdfs-datanode-2
    hostname: hdfs-datanode-2
    restart: unless-stopped
    network_mode: host

    extra_hosts:
      - "hdfs-namenode:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-datanode-1:${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}"
      - "hdfs-datanode-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

    environment:
      HDFS_DATANODE_OPTS: "-Ddfs.datanode.hostname=hdfs-datanode-2"

    volumes:
      - ../hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ../hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs_datanode_2:/data/hdfs/datanode

    command: ["hdfs", "datanode"]

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9864'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  spark-master:
    image: apache/spark:4.1.3-scala2.13-java21-python3-ubuntu
    container_name: feelm-spark-master
    hostname: spark-master
    restart: unless-stopped
    network_mode: host

    extra_hosts:
      - "spark-master:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-namenode:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-datanode-1:${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}"
      - "hdfs-datanode-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

    entrypoint:
      - /opt/spark/bin/spark-class

    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - ${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}
      - --port
      - "7077"
      - --webui-port
      - "8080"

  spark-worker-2:
    image: apache/spark:4.1.3-scala2.13-java21-python3-ubuntu
    container_name: feelm-spark-worker-2
    hostname: spark-worker-2
    restart: unless-stopped
    network_mode: host

    extra_hosts:
      - "spark-master:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "spark-worker-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-namenode:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"
      - "hdfs-datanode-1:${SERVICE_NODE_IP:?SERVICE_NODE_IP is required}"
      - "hdfs-datanode-2:${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}"

    entrypoint:
      - /opt/spark/bin/spark-class

    command:
      - org.apache.spark.deploy.worker.Worker
      - --host
      - ${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}
      - --port
      - "7078"
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - "4g"
      - spark://spark-master:7077

  kafka:
    image: apache/kafka:4.3.1
    container_name: feelm-kafka
    restart: unless-stopped
    network_mode: host

    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"

      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}:9092"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@${DISTRIBUTED_NODE_IP:?DISTRIBUTED_NODE_IP is required}:9093"

      CLUSTER_ID: "${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID is required}"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

volumes:
  hdfs_namenode:
  hdfs_datanode_2:
  kafka_data:
