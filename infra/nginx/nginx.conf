events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name j15e106.p.ssafy.io;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://j15e106.p.ssafy.io$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name j15e106.p.ssafy.io;

        ssl_certificate /etc/letsencrypt/live/j15e106.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/j15e106.p.ssafy.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html;
        index index.html;

        location = /hooks/gitlab/claude-review {
            client_max_body_size 64k;
            proxy_connect_timeout 2s;
            proxy_read_timeout 12s;
            proxy_pass http://unix:/run/feelm-claude-review/webhook.sock:/hooks/gitlab/claude-review;
        }

        location = /swagger-ui.html {
            auth_basic "Feelm Team Swagger";
            auth_basic_user_file /run/secrets/swagger_htpasswd;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://backend:8080;
        }

        location /swagger-ui/ {
            auth_basic "Feelm Team Swagger";
            auth_basic_user_file /run/secrets/swagger_htpasswd;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://backend:8080;
        }

        location /v3/api-docs {
            auth_basic "Feelm Team Swagger";
            auth_basic_user_file /run/secrets/swagger_htpasswd;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://backend:8080;
        }

        location /api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://backend:8080;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
