events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name j15e106.p.ssafy.io;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://j15e106.p.ssafy.io$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name j15e106.p.ssafy.io;

        ssl_certificate /etc/letsencrypt/live/j15e106.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/j15e106.p.ssafy.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
