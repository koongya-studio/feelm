[Unit]
Requires=feelm-ci-guard.service
After=feelm-ci-guard.service

[Service]
# This fixed, root-owned preflight needs host nft access even though user@ runs as UID 1001.
# Do not replace with ExecCondition: verification failure must fail the start.
ExecStartPre=+/usr/bin/python3 -I /usr/local/lib/feelm-ci222/ci-guard-service.py start-check
