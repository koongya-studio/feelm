global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          node_name: J15E106
          node_role: service
      - targets: ["feelm-distributed-node:9100"]
        labels:
          node_name: J15E106A
          node_role: distributed

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
