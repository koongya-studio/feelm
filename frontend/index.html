<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      아이콘은 리디자인한 로고의 심볼(`ee` 웃는 얼굴)이다(업무 S15P21E106-703, 2026-09-19).
      디자인이 준 심볼 원본을 앱의 벽 색 위 가운데에 얹었다. 마크 폭은 캔버스의 66%라
      Android maskable 아이콘의 안전 영역(지름 80% 원) 안에 들어간다. 32px 파비콘은 작은
      크기에서 읽히도록 마크를 90%로 키웠다. 한때는 서체로 쓴 `Feelm` 워드마크 SVG
      파비콘이었는데 그 로고를 폐기하며 지웠다 — 심볼은 벡터 원본이 없어 PNG만 둔다.

      PNG는 모서리를 둥글리지 않은 정사각이다. iOS · Android가 아이콘에 자체 마스크를
      씌우므로 미리 깎으면 이중으로 깎이고 코너에 흰 자국이 남는다. 탭에 쓰는 32px
      파비콘만 둥글다.

      경로에 base(`/app/`)를 적지 않는다. Vite의 HTML 변환이 `/`로 시작하는 href에
      base를 붙여 주므로, 소스의 `/favicon-32.png`가 dev와 빌드 양쪽에서
      `/app/favicon-32.png`로 나간다. `%BASE_URL%`을 쓰면 치환된 `/app/` 위에 같은 변환이
      한 번 더 붙어 dev에서 `/app/app/...`이 된다.

      `manifest.webmanifest`는 `public/`에 있어 Vite가 변환하지 않는다. 그래서 그 안의
      `src`·`start_url`·`scope`는 매니페스트 자신의 URL을 기준으로 해석되는 상대 경로로
      적었다. 양쪽 모두 base를 문자열로 박지 않으므로 base가 바뀌어도 따라간다.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#eff0f3" />
    <title>Feelm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
