<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      아이콘은 확정 로고(Gluten Bold 700 · 자간 -0.03em)의 `Feelm` 워드마크를 벡터로
      추출해 만든 것이다(업무 S15P21E106-95). 서체 로딩과 무관하게 그려지도록 글리프
      아웃라인을 path로 박았다. 바탕은 앱의 벽 색이고 글자는 브랜드 빨강이다.

      파비콘까지 워드마크 전체로 통일했다(팀 결정 2026-09-10). 16px에서는 글자가
      뭉개지지만 아이덴티티를 한 벌로 유지하는 쪽을 택했다.

      PNG는 모서리를 둥글리지 않은 정사각이다. iOS · Android가 아이콘에 자체 마스크를
      씌우므로 미리 깎으면 이중으로 깎이고 코너에 흰 자국이 남는다. 탭에 쓰는 SVG와
      32px 파비콘만 둥글다.

      경로에 base(`/app/`)를 적지 않는다. Vite의 HTML 변환이 `/`로 시작하는 href에
      base를 붙여 주므로, 소스의 `/favicon.svg`가 dev와 빌드 양쪽에서
      `/app/favicon.svg`로 나간다. `%BASE_URL%`을 쓰면 치환된 `/app/` 위에 같은 변환이
      한 번 더 붙어 dev에서 `/app/app/...`이 된다.

      `manifest.webmanifest`는 `public/`에 있어 Vite가 변환하지 않는다. 그래서 그 안의
      `src`·`start_url`·`scope`는 매니페스트 자신의 URL을 기준으로 해석되는 상대 경로로
      적었다. 양쪽 모두 base를 문자열로 박지 않으므로 base가 바뀌어도 따라간다.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#eff0f3" />
    <title>Feelm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
