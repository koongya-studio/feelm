server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 308 /app/;
    }

    location = /app {
        return 308 /app/;
    }

    location = /app/healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }
}
