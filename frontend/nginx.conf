server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 308 /app/;
    }

    location = /app {
        return 308 /app/;
    }

    location = /app/healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 서비스 워커 본문은 브라우저가 갱신 검사 때마다 원본과 대조해야 한다.
    location = /app/service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 기본 Nginx MIME 표에는 webmanifest가 없어 그대로 두면 octet-stream이 된다.
    location = /app/manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }
}
