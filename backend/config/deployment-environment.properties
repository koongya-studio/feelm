# Spring variable = required GitLab CI/CD variable used by Compose.
# @compose-default requires ${SPRING_VARIABLE:-reviewed-default} in Compose.
# @dev-default requires the variable to be absent from Compose and defaulted in application-dev.yml.
DB_URL=DB_URL
DB_USERNAME=DB_USERNAME
DB_PASSWORD=DB_PASSWORD
REDIS_HOST=@compose-default
REDIS_PASSWORD=REDIS_PASSWORD
KAFKA_BOOTSTRAP_SERVERS=DISTRIBUTED_NODE_IP
JWT_SECRET=JWT_SECRET
CORS_ALLOWED_ORIGINS=CORS_ALLOWED_ORIGINS
FRONTEND_BASE_URL=FRONTEND_BASE_URL
MAIL_MODE=@dev-default
MAIL_USERNAME=MAIL_USERNAME
MAIL_PASSWORD=MAIL_PASSWORD
