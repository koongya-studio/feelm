spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: backend
  profiles:
    default: local
  flyway:
    enabled: true
    # 빈 DB에서 시작하므로 baseline이 필요 없다.
    baseline-on-migrate: false
    validate-on-migrate: true
    # 병렬 작성으로 버전 순서가 어긋나면 로컬은 볼륨을 재생성한다.
    out-of-order: false
  jpa:
    hibernate:
      # 스키마의 유일한 출처는 Flyway 마이그레이션이다.
      ddl-auto: none
    open-in-view: false
  mail:
    # 인증 메일 발송용 SMTP. feelm.mail.mode=smtp일 때만 실제로 사용한다.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # 계정 정보는 Secret이므로 소스에 기본값을 두지 않고 환경변수로만 주입한다.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 메일은 커밋 뒤 전용 스레드 풀에서 보낸다(S15P21E106-282). Jakarta Mail 기본값은 무한 대기라
          # SMTP 장애가 발송 스레드를 영구히 붙잡아 발송 큐를 마르게 하므로 연결·읽기·쓰기에 상한(ms)을 둔다.
          # 실패는 재발송(API-003)으로 복구한다.
          #
          # 이 값들은 발송 1건 전체의 상한이 아니다. timeout과 writetimeout은 소켓 read·write마다 다시
          # 적용되고, 한 건 발송은 greeting·EHLO·STARTTLS·AUTH·MAIL FROM·RCPT TO·DATA·QUIT로 왕복이
          # 여러 번 일어난다. 서버가 매 응답을 느리게 주면 한 건이 수십 초 이상 걸린다. Jakarta Mail에는
          # 발송 1건 전체에 상한을 거는 설정이 없다. 풀 크기·큐 크기와 종료 대기는 이 사실을 전제로
          # 정했다(MailAsyncProperties, MailDispatchConfig).
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

# 리버스 프록시 뒤에서 실제 클라이언트 IP를 쓰기 위한 설정이다(S15P21E106-288). Nginx는 이미 /api를
# 프록시하므로(infra/nginx/nginx.conf), 이 설정이 없으면 모든 요청의 발신지가 Nginx 컨테이너 IP 하나로
# 보이고 전체 사용자가 IP 단위 제한의 한 예산을 함께 소모한다.
server:
  # native는 Tomcat RemoteIpValve를 쓴다. framework(ForwardedHeaderFilter)에는 신뢰할 프록시 목록
  # 개념이 없어 발신지를 가리지 않고 헤더를 믿는다.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # X-Forwarded-For가 아니라 X-Real-IP를 읽는다(리뷰 A-7·B-3). Nginx는 모든 프록시 블록에서
      # X-Real-IP를 $remote_addr로 덮어써 보내므로 클라이언트가 보낸 값이 남지 않고 항목도 하나다.
      # X-Forwarded-For도 Nginx가 $remote_addr 하나로 덮어써 클라이언트가 보낸 체인을 제거한다.
      remote-ip-header: x-real-ip
      protocol-header: x-forwarded-proto
      # 밸브는 host·port 헤더도 기본으로 신뢰하므로 애플리케이션에서는 읽지 않고, Nginx도
      # 클라이언트가 보낸 X-Forwarded-Host·X-Forwarded-Port를 제거한다(리뷰 A-8·B-5).
      host-header: ""
      port-header: ""
      # 이 목록에 있는 발신지가 보낸 헤더만 받아들인다. backend 컨테이너는 호스트 포트를 공개하지
      # 않아 Compose 네트워크에서만 닿으므로 실제 판정은 172.16.0.0/12가 전담한다. 루프백은 컨테이너
      # 자기 헬스체크와 로컬·테스트 실행 경로다. Boot 기본값은 사설 대역 전체(10/8, 100.64/10,
      # fc00::/7 포함)라 필요보다 넓다. 배포 환경의 Nginx 컨테이너 대역이 이 목록에 드는지 확인해야
      # 한다(S15P21E106-326).
      internal-proxies: 127.0.0.0/8,::1/128,172.16.0.0/12

management:
  endpoints:
    web:
      # health는 컨테이너 상태 판정, prometheus는 내부 모니터링 수집에만 사용한다.
      exposure:
        include: health,prometheus
  health:
    mail:
      # spring.mail.host가 설정되면 Boot가 mail health indicator를 자동 등록해 /actuator/health 호출마다
      # SMTP 접속을 시도한다. 인프라 헬스체크(10초 주기)가 이 경로를 보므로, 메일 서버 상태가
      # 백엔드 컨테이너의 healthy 판정을 좌우하지 않도록 끈다. 발송 실패는 재발송(API-003)으로 복구한다.
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # 평균만으로 숨겨지는 느린 요청을 Grafana에서 P95로 확인한다.
      percentiles-histogram:
        http.server.requests: true

springdoc:
  paths-to-match: /api/v1/**
  paths-to-exclude: /api/v1/test/**
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

feelm:
  avatar:
    storage-path: ${AVATAR_STORAGE_PATH:/tmp/feelm/avatars}
    public-url-prefix: ${AVATAR_PUBLIC_URL_PREFIX:/media/avatars}
  report:
    generation:
      # 반기 마감 스냅샷 생성 배치. 테스트는 설정을 두지 않아 스케줄러를 등록하지 않는다.
      enabled: ${REPORT_GENERATION_ENABLED:true}
  recommendation:
    candidates:
      # 전환 확인 후 false로 설정해 Candidate v5 호환을 제거한다.
      accept-v5: ${RECOMMENDATION_ACCEPT_V5:true}
    buffer:
      # 현재 회차의 미노출 유효 후보가 이 값 이하로 내려가면 다음 회차를 미리 만든다(S15P21E106-708).
      # TASTE와 DISCOVERY의 합이다. 올리면 더 일찍 준비하지만 쓰이지 않을 회차를 만들 수 있고,
      # 내리면 소진이 프리페치보다 먼저 와서 재생성이 조회 응답을 기다리게 된다.
      # 음수면 프리페치를 끄고 소진 시점의 동기 재생성만 쓴다.
      prefetch-threshold: 5
    reason:
      gemini:
        # 키가 없으면 확인된 근거만 사용하는 결정적 fallback을 저장한다.
        api-key: ${GMS_KEY:}
        model: ${GEMINI_REASON_MODEL:gemini-2.5-flash-lite}
  jwt:
    # 필수 Secret. 기본값을 두지 않으므로 값이 없으면 기동에 실패한다.
    secret: ${JWT_SECRET}
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    # 회전 직후 같은 Refresh Token이 한 번 더 도착해도 탈취로 보지 않는 시간(API-006 처리 규칙).
    # 끊긴 재발급이 다시 오는 정상 경우를 전량 폐기로 처리하지 않기 위한 값이며, 길수록 탈취된
    # 토큰이 통하는 창도 넓어진다(S15P21E106-596).
    refresh-rotation-grace: 10s
    # 소셜 가입을 마칠 때까지만 유효한 토큰의 수명(API-007 처리 규칙). 코드 기본값과 같은 값을 여기에
    # 두는 이유는 계약값이 바뀐 사실이 설정 diff로 드러나야 하기 때문이다(S15P21E106-311과 같은 판단).
    signup-token-ttl: 10m
    # 인증번호 확인(API-079)이 발급하고 가입(API-001)이 쓰는 토큰의 수명이다. 같은 이유로 코드 기본값과
    # 같은 값을 여기에 둔다.
    email-verification-token-ttl: 10m
    refresh-cookie:
      name: refresh_token
      path: /api/v1/auth
      secure: true
      same-site: Lax
  auth:
    # 쿠키를 주고받으려면 credentials가 필요하고, 그때는 와일드카드를 쓸 수 없어 환경별로 명시한다.
    allowed-origins: []
    mock:
      enabled: false
      user-id: 1
    # 이메일 로그인(API-004)의 연속 실패 제한이다. 카운터는 실패가 아니라 시도를 세며, 한도를 넘는
    # 시도는 비밀번호를 대조하지 않고 429가 된다. 잘못된 값(한도 1 미만, 창 1초 미만 또는 24시간 초과)은
    # 기동에 실패한다. 창에 단위를 생략하면 초로 읽는다(LoginRateLimitProperties).
    #
    # 창 길이를 바꾸면 이미 만들어진 카운터는 옛 창이 만료될 때까지 옛 길이를 유지한다. 로그인 키에는
    # 메일 제한과 달리 창 길이가 들어 있지 않기 때문이다.
    login:
      attempt-limit: 5
      attempt-window: 10m
      # IP 단위 시도 제한이다(S15P21E106-312). 이메일 축은 한 계정을 겨냥한 무차별 대입만 막아, 비밀번호
      # 하나를 서로 다른 계정에 한 번씩 넣는 password spraying과 남의 계정을 반복해서 잠그는 시도는
      # 어디에도 세지지 않는다. 목록이 비어 있으면 IP 축은 제한하지 않는다(기동 시 WARN으로 알린다).
      # 같은 창을 두 번 넣으면 기동에 실패하고, 어떤 순서로 적어도 짧은 창이 먼저 평가된다.
      #
      # 정상 로그인도 예산을 소모하므로(카운터는 실패가 아니라 시도를 센다) 한도는 공유 NAT 기준으로
      # 정했다. 캠퍼스망이나 시연 환경, 모바일 CGNAT에서는 수십 명이 같은 IP로 보이고 수업이나 시연
      # 시작처럼 로그인이 한꺼번에 몰리는 구간이 있다. 10분에 60회는 그런 구간을 통과시키면서, 한 IP가
      # 10분 안에 잠글 수 있는 계정을 12개(계정당 5회면 그 계정의 다음 요청부터 429다)로, 1시간에는
      # 60개로 묶는다. 고정 창이라 창 경계에서는 10분에 최대 120회까지 몰릴 수 있고, 그 상한은 1시간
      # 창이 잡는다.
      #
      # 대가: 같은 IP를 쓰는 제3자가 예산을 고갈시키면 그 IP의 정상 사용자도 비밀번호가 맞아도 429다.
      # 이메일 축에서 429가 된 요청과 미인증 계정의 반복 로그인도 IP 예산을 소모하므로, 잠긴 계정의
      # 재시도가 같은 IP의 다른 사용자에게 번질 수 있다.
      #
      # 예산 주체: 클라이언트 IP는 신뢰 경계 안의 프록시가 보낸 X-Real-IP에서 오고(S15P21E106-288),
      # 예산은 주소 하나가 아니라 아래 client-ip가 정한 프리픽스 버킷 단위로 나뉜다. IPv6 사용자가
      # 주소만 바꿔 예산을 새로 얻지 못하므로, 위 한도는 주소 하나가 아니라 버킷 하나의 예산이다.
      ip:
        - limit: 60
          window: 10m
        - limit: 300
          window: 1h
    # 이메일 회원가입(API-001)의 IP 단위 요청 제한이다(S15P21E106-603). 메일 축(feelm.mail.rate-limit)과
    # 카운터도 설정도 나눈다. 인증번호 전환 뒤로 가입은 메일을 보내지 않아 발송 쿼터를 공유할 이유가 없고,
    # 공유하면 가입 한 건이 같은 예산을 발송과 가입으로 두 번 소모해 공유 NAT 한 버킷의 실질 가입 한도가
    # 절반이 된다(601 결정 4). 값은 계약(API-001)이 약속하는 30건/1시간이며, 목록이 비어 있으면 제한하지
    # 않는다. 이메일 단위 간격은 두지 않는다. 같은 이메일의 반복 가입은 인증 토큰이 1회용이라 막힌다.
    signup:
      ip:
        - limit: ${SIGNUP_RATE_LIMIT_IP_LIMIT:30}
          window: ${SIGNUP_RATE_LIMIT_IP_WINDOW:1h}
    # IP 단위 제한이 예산을 나누는 집계 단위다(S15P21E106-288). IPv6 종단 사용자는 보통 /64 이상을
    # 배정받아 주소 단위로 세면 주소만 바꿔 예산을 새로 얻는다. IPv4는 NAT 뒤 공용 주소를 이미 여러
    # 사용자가 나눠 쓰므로 더 넓히지 않는다. 1 미만이거나 대역 상한을 넘는 값은 기동에 실패한다.
    client-ip:
      ipv4-prefix-length: 32
      ipv6-prefix-length: 64
  oauth:
    # 소셜 로그인(API-007·009)이 허용할 redirectUri 목록이다. 정확히 일치하는 값만 통과하며,
    # 비어 있으면 모든 요청을 거절한다. 허용 목록을 열어 두면 인가 코드를 공격자의 화면으로
    # 돌려받을 수 있어 환경마다 명시한다.
    allowed-redirect-uris: ${OAUTH_ALLOWED_REDIRECT_URIS:}
    # 자격 증명이 없는 제공자는 등록되지 않고 호출 시 UNSUPPORTED_PROVIDER로 응답한다.
    # client-secret은 Secret이므로 소스에 기본값을 두지 않는다.
    providers:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
      kakao:
        client-id: ${KAKAO_CLIENT_ID:}
        client-secret: ${KAKAO_CLIENT_SECRET:}
      naver:
        client-id: ${NAVER_CLIENT_ID:}
        client-secret: ${NAVER_CLIENT_SECRET:}
  mail:
    # 필수. log는 발송 대신 인증 링크를 로그로 남기는 로컬 확인용이고, local·test 밖에서 log면 기동에 실패한다.
    # 기본값을 두지 않는다. 프로파일 없이 뜬 배포가 조용히 log 모드로 흘러가 토큰이 로그에 남는 것을 막기 위해서다.
    mode: ${MAIL_MODE}
    from: ${MAIL_FROM:no-reply@feelm.local}
    # 재설정 링크는 프론트 화면으로 가고 프론트가 API-011을 호출한다. 화면은 0.7-A다.
    #
    # 경로는 프론트엔드 라우트에서 파생된 값이다. 앱은 Vite base가 /app/이라 모든 화면이 /app
    # 아래에 있고(frontend/vite.config.ts), 화면별 경로는 frontend/src/routes/paths.ts가 가진다.
    # FRONTEND_BASE_URL은 사이트 주소이지 앱 주소가 아니므로 /app을 여기서 붙인다. 프론트 경로가
    # 바뀌면 이 값도 함께 바뀌어야 한다(S15P21E106-367).
    password-reset-url: ${FRONTEND_BASE_URL:http://localhost:5173}/app/account/reset
    # 인증번호 발송(API-078)과 재설정 요청(API-010)의 요청 단위 제한이다. 이메일 간격만으로는
    # 서로 다른 이메일을 대량으로 넣는 발송 폭탄을 막지 못하므로 IP 단위를 함께 둔다. ip는 창
    # 목록이라 창을 늘리거나 줄여도 코드가 그대로다(S15P21E106-281 결정 D-8).
    #
    # 전역 축은 여기에 없다. 요청을 세는 전역 상한은 메일을 한 통도 보내지 않고 예산을 말릴 수
    # 있어(IP 버킷 30개면 하루치가 마른다) 정상 사용자의 계정 복구를 막는 지렛대였다. SMTP 쿼터를
    # 지키는 상한은 실제 발송을 세는 아래 send-budget으로 옮겼다(S15P21E106-287 결정 D-1·D-4).
    rate-limit:
      # 같은 이메일로 다시 요청할 수 있게 되기까지의 최소 간격. 두 경로가 같은 값을 쓴다.
      email-interval: ${MAIL_RATE_LIMIT_EMAIL_INTERVAL:1m}
      # 공용 NAT 뒤 IPv4 한 버킷을 수십 명이 함께 쓰는 시연·캠퍼스망에서는 10건이 정상 사용자끼리
      # 소모할 수 있는 양이다. 로그인 IP 축을 공유 NAT 기준으로 넉넉히 잡은 것과 같은 논리로 30건에
      # 둔다(S15P21E106-287 결정 D-7). 예산 주체는 주소 하나가 아니라 feelm.auth.client-ip가
      # 정한 프리픽스 버킷이다.
      ip:
        - limit: ${MAIL_RATE_LIMIT_IP_LIMIT:30}
          window: ${MAIL_RATE_LIMIT_IP_WINDOW:1h}
    # 계정 메일 전체(인증번호·재설정)의 전역 발송 상한이다. SMTP 계정의 발송 쿼터를 지키는
    # 값이라 시도가 아니라 실제 발송을 세고, 요청 경로가 아니라 발송 스레드에서 소모한다. 그래서 이
    # 상한은 응답(202·201)을 바꾸지 않으며, 상한을 넘긴 메일은 발송하지 않고 버린다. 사용자의
    # 재발송·재요청·재가입이 복구 경로다(S15P21E106-287 결정 D-2·D-5·D-6).
    #
    # 값의 근거는 팀 Gmail 계정의 일 발송 상한(무료 계정 500통)이다. 그 아래에서 시간 창과 일 창을
    # 함께 두어, 짧은 폭주와 하루 총량을 각각 묶는다. 목록이 비어 있으면 상한이 없다(기동 시 WARN).
    # 상한의 80%에 닿을 때와 상한을 넘을 때 창마다 한 번씩 WARN이 남고, 현재 사용량은 읽기 전용
    # Redis로 조회한다(backend/README.md).
    send-budget:
      windows:
        - limit: ${MAIL_SEND_BUDGET_HOURLY_LIMIT:100}
          window: 1h
        - limit: ${MAIL_SEND_BUDGET_DAILY_LIMIT:300}
          window: 24h
  notification:
    web-push:
      # disabled는 새 구독과 발송을 막고 config API는 enabled=false로 응답한다. 기존 구독 해제와
      # 만료 capability 정리는 비활성화 중에도 허용한다.
      # VAPID 개인키는 환경변수로만 주입하며 로그·응답·메트릭에 넣지 않는다.
      mode: ${WEB_PUSH_MODE:disabled}
      public-key: ${WEB_PUSH_VAPID_PUBLIC_KEY:}
      private-key: ${WEB_PUSH_VAPID_PRIVATE_KEY:}
      subject: ${WEB_PUSH_VAPID_SUBJECT:}
      allowed-endpoint-host-suffixes:
        - fcm.googleapis.com
        - push.services.mozilla.com
        - push.apple.com
      poll-interval: ${WEB_PUSH_POLL_INTERVAL:1s}
      batch-size: ${WEB_PUSH_BATCH_SIZE:25}
      maximum-attempts: ${WEB_PUSH_MAXIMUM_ATTEMPTS:5}
      initial-retry-delay: ${WEB_PUSH_INITIAL_RETRY_DELAY:1m}
      maximum-retry-delay: ${WEB_PUSH_MAXIMUM_RETRY_DELAY:1h}
      lease-duration: ${WEB_PUSH_LEASE_DURATION:2m}
      request-timeout: ${WEB_PUSH_REQUEST_TIMEOUT:15s}
  kafka:
    outbox:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      # 별점 저장부터 추천 후보 갱신까지의 실측 결과에 따라 환경변수로 조정한다.
      poll-interval: ${KAFKA_OUTBOX_POLL_INTERVAL:500ms}
      batch-size: ${KAFKA_OUTBOX_BATCH_SIZE:100}
      maximum-retry-delay: ${KAFKA_OUTBOX_MAX_RETRY_DELAY:30s}
      published-retention: ${KAFKA_OUTBOX_PUBLISHED_RETENTION:7d}
      cleanup-interval: ${KAFKA_OUTBOX_CLEANUP_INTERVAL:1h}
