spring:
  application:
    name: backend
  profiles:
    default: local
  flyway:
    enabled: true
    # 빈 DB에서 시작하므로 baseline이 필요 없다.
    baseline-on-migrate: false
    validate-on-migrate: true
    # 병렬 작성으로 버전 순서가 어긋나면 로컬은 볼륨을 재생성한다.
    out-of-order: false
  jpa:
    hibernate:
      # 스키마의 유일한 출처는 Flyway 마이그레이션이다.
      ddl-auto: none
    open-in-view: false

feelm:
  jwt:
    # 필수 Secret. 기본값을 두지 않으므로 값이 없으면 기동에 실패한다.
    secret: ${JWT_SECRET}
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    refresh-cookie:
      name: refresh_token
      path: /api/v1/auth
      secure: true
      same-site: Lax
  auth:
    # 쿠키를 주고받으려면 credentials가 필요하고, 그때는 와일드카드를 쓸 수 없어 환경별로 명시한다.
    allowed-origins: []
    mock:
      enabled: false
      user-id: 1
