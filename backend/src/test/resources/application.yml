spring:
  datasource:
    url: jdbc:h2:mem:feelm-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
  flyway:
    # 기본 테스트는 H2를 쓴다. Flyway SQL은 PostgreSQL 문법이라 실행되지 않으므로 끈다.
    # 마이그레이션 자체는 migration 패키지의 Testcontainers 테스트가 실제 PostgreSQL에서 검증한다.
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

feelm:
  avatar:
    storage-path: ${AVATAR_STORAGE_PATH:${java.io.tmpdir}/feelm/avatars}
    public-url-prefix: /media/avatars
  kafka:
    outbox:
      # Spring 테스트 클래스가 병렬 실행되므로 다른 ApplicationContext의 Relay가 공유 DB 행을
      # 선점하지 않게 한다. Relay 전달·재시도는 생성자로 직접 구성하는 전용 테스트가 검증한다.
      relay-enabled: false
  report-image:
    storage-path: ${REPORT_IMAGE_STORAGE_PATH:${java.io.tmpdir}/feelm/report-images}
    # 테스트 전용이며 JWT 테스트 키와 의도적으로 다르다.
    signing-secret: feelm-test-report-image-key-at-least-32-bytes
    url-ttl: 10m
    regeneration-interval: 1m
    download-url-prefix: /api/v1/report-images
  recommendation:
    buffer:
      # 프리페치는 응답과 분리된 배경 작업이라 테스트가 끝난 뒤에도 DB를 읽는다. 다음 테스트의
      # TRUNCATE와 겹치면 교착이 난다. 기본은 끄고, 프리페치를 검증하는 테스트만 값을 지정해 켠다.
      prefetch-threshold: -1
    # 개인 추천 consumer는 localhost Kafka에 붙으므로 기본은 끄고, offset 통합 테스트만 켠다.
    candidate-consumer-enabled: false
  notification:
    web-push:
      mode: disabled
  party:
    refresh:
      consumer-enabled: false
      worker-enabled: false
    candidate-updated:
      # 고정 topic/group consumer는 Kafka container 계약 테스트에서만 명시적으로 켠다.
      consumer-enabled: false
  jwt:
    # 테스트 전용 값이며 실제 환경의 Secret과 무관하다.
    secret: feelm-test-signing-key-for-hs256-at-least-32-bytes
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    refresh-cookie:
      name: refresh_token
      path: /api/v1/auth
      # 테스트의 MockMvc는 평문 요청이므로 Secure 속성을 끈다. 운영 기본값은 true다.
      secure: false
      same-site: Lax
  auth:
    allowed-origins:
      - http://localhost:5173
    mock:
      enabled: false
      user-id: 1
    # 운영 기본값을 그대로 명시한다. 기존 로그인 계약 테스트가 5회/10분 동작을 검증한다.
    login:
      attempt-limit: 5
      attempt-window: 10m
      # IP 한도는 반복 요청 횟수를 줄이려고 작게 두되, 이메일 한도(5)보다는 크게 둔다. 운영은 60 > 5로
      # 이메일 축이 먼저 걸리는데 테스트가 3 < 5로 대소를 뒤집으면, 이메일 축 429가 IP 예산을 소모하는
      # 경로를 어떤 테스트도 재현하지 못한다(리뷰 B-7). 컨텍스트를 공유하는 테스트는 요청마다 다른
      # IP에서 보내므로(EmailAuthApiTestSupport) 서로의 IP 예산을 소모하지 않는다. 두 창을 두어 목록의
      # 창을 모두 평가하는지도 함께 검증한다.
      ip:
        - limit: 8
          window: 10m
        - limit: 12
          window: 1h
    # 운영 기본값을 그대로 명시한다. 공유 컨텍스트 테스트가 nextClientIp()의 10.x.y.z로 IP 예산을
    # 격리하는데, 그 격리는 ipv4-prefix-length가 32라는 전제에 매달린다(리뷰 A-9).
    client-ip:
      ipv4-prefix-length: 32
      ipv6-prefix-length: 64
    # 가입(API-001)의 IP 한도. 메일 축과 카운터가 분리돼 있으므로(S15P21E106-603) 값도 따로 둔다.
    # 반복 요청 횟수를 줄이려고 작게 둔다.
    signup:
      ip:
        - limit: 3
          window: 1h
  mail:
    # 테스트는 발송하지 않고 스파이 빈으로 토큰을 얻지만, 모드에 기본값이 없으므로 명시한다.
    mode: log
    rate-limit:
      # 이메일 간격은 운영 기본값(1분)을 그대로 둔다. 기존 계약 테스트가 이 간격 동작을 검증한다.
      email-interval: 1m
      # IP 한도는 반복 요청 횟수를 줄이려고 작게 둔다.
      ip:
        - limit: 3
          window: 1h
    # 전역 발송 상한은 컨텍스트를 공유하는 다른 테스트의 발송도 함께 소모하므로 크게 둔다. 작게 두면
    # 이 파일과 무관한 테스트가 상한에 걸려 메일을 받지 못한다. 상한을 검증하는 테스트는 요청을
    # 반복하는 대신 카운터를 직접 채우고 지우므로 값이 커도 느려지지 않는다. 두 창을 두어 목록의 창을
    # 모두 세는지도 함께 본다.
    send-budget:
      windows:
        - limit: 2000
          window: 1h
        - limit: 5000
          window: 24h
  oauth:
    # provider 호출은 테스트 대역이 대신하므로 자격 증명은 두지 않는다. 허용 목록(D-4)만
    # 검증 대상이라 명시한다.
    allowed-redirect-uris:
      - https://feelm.app/oauth/callback
      - https://feelm.app/oauth/link-callback
