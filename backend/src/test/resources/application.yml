spring:
  datasource:
    url: jdbc:h2:mem:feelm-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    # 기본 테스트는 H2를 쓴다. Flyway SQL은 PostgreSQL 문법이라 실행되지 않으므로 끈다.
    # 마이그레이션 자체는 migration 패키지의 Testcontainers 테스트가 실제 PostgreSQL에서 검증한다.
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

feelm:
  jwt:
    # 테스트 전용 값이며 실제 환경의 Secret과 무관하다.
    secret: feelm-test-signing-key-for-hs256-at-least-32-bytes
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    refresh-cookie:
      name: refresh_token
      path: /api/v1/auth
      # 테스트의 MockMvc는 평문 요청이므로 Secure 속성을 끈다. 운영 기본값은 true다.
      secure: false
      same-site: Lax
  auth:
    allowed-origins:
      - http://localhost:5173
    mock:
      enabled: false
      user-id: 1
    # 운영 기본값을 그대로 명시한다. 기존 로그인 계약 테스트가 5회/10분 동작을 검증한다.
    login:
      attempt-limit: 5
      attempt-window: 10m
    # 운영 기본값을 그대로 명시한다. 공유 컨텍스트 테스트가 nextClientIp()의 10.x.y.z로 IP 예산을
    # 격리하는데, 그 격리는 ipv4-prefix-length가 32라는 전제에 매달린다(리뷰 A-9).
    client-ip:
      ipv4-prefix-length: 32
      ipv6-prefix-length: 64
  mail:
    # 테스트는 발송하지 않고 스파이 빈으로 토큰을 얻지만, 모드에 기본값이 없으므로 명시한다.
    mode: log
    rate-limit:
      # 이메일 간격은 운영 기본값(1분)을 그대로 둔다. 기존 계약 테스트가 이 간격 동작을 검증한다.
      email-interval: 1m
      # IP 한도는 반복 요청 횟수를 줄이려고 작게 둔다.
      ip:
        - limit: 3
          window: 1h
      # 전역 한도는 컨텍스트를 공유하는 다른 테스트도 함께 소모하므로 크게 둔다.
      # 전역 제한을 검증하는 테스트만 카운터를 한도까지 직접 채우고 지운다.
      global:
        - limit: 2000
          window: 1h
        - limit: 5000
          window: 24h
  oauth:
    # provider 호출은 테스트 대역이 대신하므로 자격 증명은 두지 않는다. 허용 목록(D-4)만
    # 검증 대상이라 명시한다.
    allowed-redirect-uris:
      - https://feelm.app/oauth/callback
      - https://feelm.app/oauth/link-callback
