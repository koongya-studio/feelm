spring:
  datasource:
    url: jdbc:h2:mem:feelm-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    # 기본 테스트는 H2를 쓴다. Flyway SQL은 PostgreSQL 문법이라 실행되지 않으므로 끈다.
    # 마이그레이션 자체는 migration 패키지의 Testcontainers 테스트가 실제 PostgreSQL에서 검증한다.
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

feelm:
  jwt:
    # 테스트 전용 값이며 실제 환경의 Secret과 무관하다.
    secret: feelm-test-signing-key-for-hs256-at-least-32-bytes
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    refresh-cookie:
      name: refresh_token
      path: /api/v1/auth
      # 테스트의 MockMvc는 평문 요청이므로 Secure 속성을 끈다. 운영 기본값은 true다.
      secure: false
      same-site: Lax
  auth:
    allowed-origins:
      - http://localhost:5173
    mock:
      enabled: false
      user-id: 1
  mail:
    # 테스트는 발송하지 않고 스파이 빈으로 토큰을 얻지만, 모드에 기본값이 없으므로 명시한다.
    mode: log
  oauth:
    # provider 호출은 테스트 대역이 대신하므로 자격 증명은 두지 않는다. 허용 목록(D-4)만
    # 검증 대상이라 명시한다.
    allowed-redirect-uris:
      - https://feelm.app/oauth/callback
      - https://feelm.app/oauth/link-callback
