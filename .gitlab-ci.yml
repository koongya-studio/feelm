stages:
  - verify
  - test
  - build
  - deploy

claude-auth-check:
  stage: verify
  tags:
    - e106-claude-review
  needs: []
  variables:
    GIT_SUBMODULE_STRATEGY: none
  environment:
    name: claude-review
    action: prepare
  resource_group: claude-review
  script:
    - /usr/bin/python3 -I -B infra/claude-review/auth-check.py
  timeout: 5m
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
      when: manual
      allow_failure: true

claude-mr-review:
  stage: verify
  tags:
    - e106-claude-review
  needs: []
  variables:
    GIT_DEPTH: "1"
    GIT_SUBMODULE_STRATEGY: none
    RUNNER_SCRIPT_TIMEOUT: "8m"
    RUNNER_AFTER_SCRIPT_TIMEOUT: "1m"
  environment:
    name: claude-review
    action: prepare
  resource_group: claude-review
  cache: []
  script:
    - /usr/bin/python3 -I -B infra/claude-review/review-status.py running
    - /usr/bin/python3 -I -B infra/claude-review/collect-mr.py
    - /usr/bin/python3 -I -B infra/claude-review/generate-review.py
    - /usr/bin/python3 -I -B infra/claude-review/publish-review.py
  after_script:
    - /usr/bin/python3 -I -B infra/claude-review/review-status.py "$CI_JOB_STATUS"
  timeout: 10m
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "api" && $CLAUDE_REVIEW_TRIGGER == "comment"'
      when: on_success
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

runner-check:
  stage: verify
  tags:
    - e106-shell
  script:
    - echo "E106 GitLab Runner connected"
    - hostname
    - whoami
    - docker --version
    - docker compose version
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CLAUDE_REVIEW_TRIGGER == "comment"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'

backend-cache-status:
  stage: verify
  tags:
    - e106-mr-isolated
  variables:
    GIT_STRATEGY: none
  script:
    - echo Backend dependency cache refresh required
  interruptible: true
  timeout: 5m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes:
        - backend/build.gradle
        - backend/build.gradle.kts
        - backend/settings.gradle
        - backend/settings.gradle.kts
        - backend/gradle.properties
        - backend/gradle/libs.versions.toml
        - backend/gradle/wrapper/gradle-wrapper.properties

backend-mr-test:
  stage: test
  tags:
    - e106-mr-isolated
  dependencies: []
  variables:
    GIT_STRATEGY: none
  script:
    - cd backend
    - ./gradlew clean test spotlessCheck --no-daemon
  interruptible: true
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      # Compare the whole MR with its target branch, not only the latest commit.
      changes:
        - backend/**/*
        - .gitlab-ci.yml
        - .gitattributes
        - infra/scripts/ci-*.py
        - infra/scripts/rootless-backend/**/*
        - infra/scripts/systemd/feelm-ci*.service

.backend-cache-action:
  stage: verify
  tags:
    - e106-shell
  variables:
    GIT_STRATEGY: fetch
  resource_group: service-and-backend-cache
  script:
    - /usr/bin/python3 -I -B infra/scripts/ci-dependency-cache-context.py | sudo -n /usr/bin/python3 -I -B /usr/local/lib/feelm-ci222/gitlab/ci-dependency-cache.py
  allow_failure: false

backend-cache-prepare:
  extends: .backend-cache-action
  variables:
    CACHE_ACTION: prepare
  timeout: 60m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CACHE_ACTION == "prepare"'
      when: manual

backend-cache-promote:
  extends: .backend-cache-action
  variables:
    CACHE_ACTION: promote
  timeout: 10m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CACHE_ACTION == "promote"'
      when: manual

backend-cache-rollback:
  extends: .backend-cache-action
  variables:
    CACHE_ACTION: rollback
  timeout: 10m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CACHE_ACTION == "rollback"'
      when: manual

backend-test:
  stage: test
  tags:
    - e106-shell
  script:
    - python3 -B -m unittest infra.scripts.test_ci_deploy_current_commit infra.scripts.test_deploy_backend -v
    - cd backend
    - ./gradlew clean test spotlessCheck --no-daemon
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CLAUDE_REVIEW_TRIGGER == "comment"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'

frontend-test:
  stage: test
  tags:
    - e106-shell
  script:
    - docker run --rm --pull always --volume "$CI_PROJECT_DIR/frontend:/src:ro" --workdir /app node:20.19-alpine sh -c 'cp -R /src/. /app && npm ci && npm run lint && npm run format:check && npm run build'
  interruptible: true
  timeout: 15m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CLAUDE_REVIEW_TRIGGER == "comment"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
        - .gitattributes

backend-image:
  stage: build
  tags:
    - e106-shell
  needs:
    - backend-test
  before_script:
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - BACKEND_IMAGE="$DOCKERHUB_NAMESPACE/feelm-backend:$CI_COMMIT_SHA"
    - docker build --pull -t "$BACKEND_IMAGE" ./backend
    - docker push "$BACKEND_IMAGE"
    - echo "Built backend image $BACKEND_IMAGE"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CLAUDE_REVIEW_TRIGGER == "comment"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'

frontend-image:
  stage: build
  tags:
    - e106-shell
  needs:
    - frontend-test
  before_script:
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - FRONTEND_IMAGE="$DOCKERHUB_NAMESPACE/feelm-frontend:$CI_COMMIT_SHA"
    - docker build --pull -t "$FRONTEND_IMAGE" ./frontend
    - docker push "$FRONTEND_IMAGE"
    - echo "Built frontend image $FRONTEND_IMAGE"
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CLAUDE_REVIEW_TRIGGER == "comment"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
        - .gitattributes

deploy-backend:
  stage: deploy
  tags:
    - e106-shell
  needs:
    - backend-image
  resource_group: service-and-backend-cache
  environment:
    name: service
  before_script:
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - /usr/bin/python3 -I -B infra/scripts/ci-deploy-current-commit.py
    - BACKEND_IMAGE="$DOCKERHUB_NAMESPACE/feelm-backend:$CI_COMMIT_SHA"
    - ./infra/scripts/deploy-backend.sh "$BACKEND_IMAGE"
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  timeout: 15m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CLAUDE_REVIEW_TRIGGER == "comment"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'
  allow_failure: false
