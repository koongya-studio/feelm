stages:
  - verify
  - test
  - build
  - deploy

claude-auth-check:
  stage: verify
  tags:
    - e106-claude-review
  needs: []
  variables:
    GIT_SUBMODULE_STRATEGY: none
  environment:
    name: claude-review
    action: prepare
  resource_group: claude-review
  script:
    - /usr/bin/python3 -I -B infra/claude-review/auth-check.py
  timeout: 5m
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
      when: manual
      allow_failure: true

claude-mr-review:
  stage: verify
  tags:
    - e106-claude-review
  needs: []
  variables:
    GIT_DEPTH: "1"
    GIT_SUBMODULE_STRATEGY: none
  environment:
    name: claude-review
    action: prepare
  resource_group: claude-review
  cache: []
  script:
    - /usr/bin/python3 -I -B infra/claude-review/collect-mr.py
    - /usr/bin/python3 -I -B infra/claude-review/generate-review.py
    - /usr/bin/python3 -I -B infra/claude-review/publish-review.py
  timeout: 10m
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "api" && $CLAUDE_REVIEW_TRIGGER == "comment"'
      when: on_success
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

runner-check:
  stage: verify
  tags:
    - e106-shell
  script:
    - echo "E106 GitLab Runner connected"
    - hostname
    - whoami
    - docker --version
    - docker compose version
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CLAUDE_REVIEW_TRIGGER == "comment"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'

backend-mr-test:
  stage: test
  tags:
    - e106-mr-isolated
  variables:
    GIT_STRATEGY: none
  script:
    - cd backend
    - ./gradlew clean test spotlessCheck --no-daemon
  interruptible: true
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'

backend-test:
  stage: test
  tags:
    - e106-shell
  script:
    - cd backend
    - ./gradlew clean test spotlessCheck --no-daemon
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CLAUDE_REVIEW_TRIGGER == "comment"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'

backend-image:
  stage: build
  tags:
    - e106-shell
  needs:
    - backend-test
  before_script:
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - BACKEND_IMAGE="$DOCKERHUB_NAMESPACE/feelm-backend:$CI_COMMIT_SHA"
    - docker build --pull -t "$BACKEND_IMAGE" ./backend
    - docker push "$BACKEND_IMAGE"
    - echo "Built backend image $BACKEND_IMAGE"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CLAUDE_REVIEW_TRIGGER == "comment"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy-backend:
  stage: deploy
  tags:
    - e106-shell
  needs:
    - backend-image
  resource_group: service-deployment
  environment:
    name: service
  before_script:
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - BACKEND_IMAGE="$DOCKERHUB_NAMESPACE/feelm-backend:$CI_COMMIT_SHA"
    - ./infra/scripts/deploy-backend.sh "$BACKEND_IMAGE"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CLAUDE_REVIEW_TRIGGER == "comment"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
  allow_failure: false
